<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Siddhesh Thapa — cognitive constellation</title>
<style>
/* ── V02 tokens. Every colour has a declared semantic role (DESIGN-V02 §4.1).
      Never pure #ffffff: a faint cool tint, the same refusal of a pure value
      that Linear applies to black. ─────────────────────────────────────── */
:root{
  /* DEEP SPACE. The mind is a constellation now, so the page is the sky it
     hangs in. Never pure black — nothing out there is empty, and pure black is
     what makes a starfield look cheap. */
  --ground-0:#05070f; --ground-1:#090d18; --ground-2:#111726; --ground-3:#1a2233;
  --depth-far:#2b3446;
  --ink:#e9eef8; --ink-muted:#a7b4ca; --ink-subtle:#6e7c94;
  --line:#232d40;
  --accent:#7fb0e8; --focus:#9cc4f0;
  /* the scrim: what keeps white type legible over white stars. A gradient,
     not a backdrop blur — a blur is a per-frame cost on a weak GPU and buys
     nothing a gradient cannot do here. */
  --scrim:rgba(5,7,15,.90); --scrim-soft:rgba(5,7,15,.62);
  --serif:Georgia,'Iowan Old Style','Times New Roman',Times,serif;
  --sans:-apple-system,'Segoe UI Variable Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,'Cascadia Mono',Consolas,'SF Mono',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:#05070f;color:var(--ink);
  font-family:var(--sans);overscroll-behavior:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* the DOM semantic layer — the SOURCE OF STRUCTURE. Delete the canvas and this
   must still carry the whole mind (DESIGN-V02 §22). */
#skip{position:absolute;left:-9999px;top:0;z-index:50;background:var(--ground-0);
  color:var(--ink);padding:10px 14px;border:1px solid var(--line)}
#skip:focus{left:12px;top:12px}
#semantic{position:fixed;left:0;top:0;width:min(380px,86vw);max-height:100vh;overflow:auto;
  padding:22px 24px 40px;z-index:10;
  /* the type sits on its own darkness, fading into the sky rather than ending
     at a hard edge */
  background:linear-gradient(90deg,var(--scrim) 0%,var(--scrim) 58%,rgba(5,7,15,0) 100%)}
@media (max-width:767px){
  #semantic{background:linear-gradient(180deg,rgba(5,7,15,0) 0%,var(--scrim) 9%,var(--scrim) 100%)}
}
#semantic h1{font-family:var(--serif);font-weight:400;font-size:15px;letter-spacing:.02em;
  margin:0 0 2px;color:var(--ink-muted)}
#where{font-family:var(--serif);font-size:clamp(30px,3.4vw,52px);line-height:1.05;
  letter-spacing:-.03em;font-weight:400;margin:0 0 6px}
#gloss{font-family:var(--serif);font-size:16px;line-height:1.5;color:var(--ink-muted);
  margin:0 0 18px;max-width:34ch}
#status{position:absolute;left:-9999px}
.grp{margin:0 0 16px}
.grp h2{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-subtle);font-weight:400;margin:0 0 7px}
.nav{list-style:none;margin:0;padding:0}
.nav li{margin:0 0 1px}
.nav button{display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;
  font:inherit;color:var(--ink);padding:7px 8px;min-height:44px;border-radius:3px;
  border-left:2px solid transparent;transition:background 160ms ease,border-color 160ms ease}
.nav button:hover{background:var(--ground-2)}
.nav button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.nav button[aria-current="true"]{border-left-color:var(--accent);background:var(--ground-1)}
.nav .lbl{font-family:var(--serif);font-size:15px;line-height:1.25;display:block}
.nav .src{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-subtle);opacity:.62;margin:3px 0 1px}
.nav [data-nav]:hover .src,.nav [data-nav]:focus-visible .src{opacity:1}
.nav .meta{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-subtle);display:block;margin-top:3px}
.nav .verb{color:var(--accent)}

/* two controls, two promises — unchanged from V1 (DESIGN-V02 §10) */
.ctl{position:fixed;z-index:20;background:none;border:0;cursor:pointer;color:var(--ink-muted);
  width:44px;height:44px;display:grid;place-items:center;border-radius:4px}
.ctl:hover{color:var(--ink);background:var(--ground-2)}
.ctl:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
#backBtn{left:6px;top:6px;font-size:19px;font-family:var(--mono)}
#mindBtn{right:6px;top:6px}
#mindBtn svg{width:19px;height:19px}
#backBtn[hidden],#mindBtn[hidden]{display:none}

/* projected labels — spatial identity, still ordinary DOM text */
#labels{position:fixed;inset:0;pointer-events:none;z-index:5}
.lb{position:absolute;left:0;top:0;white-space:nowrap;color:var(--ink-muted);
  font-family:var(--mono);letter-spacing:.16em;text-transform:uppercase;display:none;
  /* a label sits over a field of white stars, so it carries its own darkness.
     Three tight shadows read as a halo rather than as a drop shadow. */
  text-shadow:0 0 4px rgba(5,7,15,.95),0 0 9px rgba(5,7,15,.85),0 0 16px rgba(5,7,15,.6)}
/* §16 — the region is primary, the system it borrows is secondary. Two
   levels, never one flat row of equally loud text. */
.lb-mig{font-size:11px;color:var(--ink);letter-spacing:.2em;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:2px}
.lb-name{display:block}
.lb-src{display:block;font-size:7.5px;letter-spacing:.14em;color:var(--ink-subtle);
  opacity:.8}
.lb-min{font-size:9px}
.lb-w{font-size:8.5px;color:var(--ink-subtle);letter-spacing:.1em;text-transform:none;
  font-family:var(--serif);font-style:italic}

/* the threshold — the first ten seconds. The universe is already behind it,
   faintly, so entering is a change of attention rather than a page load. */
#threshold{position:fixed;inset:0;z-index:40;display:grid;place-items:center;
  background:none;transition:opacity 520ms ease,visibility 520ms}
/* the copy carries its own darkness so the sky stays visible everywhere else */
.th-in{position:relative}
.th-in::before{content:'';position:absolute;inset:-8vh -14vw -10vh -22vw;z-index:-1;
  background:radial-gradient(58% 62% at 34% 50%,var(--scrim) 0%,
             var(--scrim-soft) 46%,rgba(5,7,15,0) 78%)}
/* The region sheet belongs to the mind, not to the threshold. While the
   threshold is up it is hidden, so the panel can stay translucent at EVERY
   width and the brain is visible behind it — including on a phone, where the
   sheet would otherwise print straight through the glass. */
body:not(.entered) #semantic{opacity:0;pointer-events:none}
#semantic{transition:opacity 460ms ease}
#threshold.gone{opacity:0;visibility:hidden;pointer-events:none}
.th-in{max-width:38rem;padding:0 26px;text-align:left}
.th-eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-subtle);margin:0 0 14px}
.th-name{font-family:var(--serif);font-weight:400;font-size:clamp(44px,7vw,96px);line-height:1.0;
  letter-spacing:-.035em;margin:0 0 18px}
.th-facts{font-family:var(--serif);font-size:clamp(17px,1.6vw,21px);line-height:1.5;
  color:var(--ink-muted);margin:0 0 30px;max-width:30ch}
#enterBtn{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;
  background:none;border:1px solid var(--ink-subtle);color:var(--ink);padding:15px 22px;
  min-height:48px;cursor:pointer;border-radius:2px;transition:background 200ms ease,border-color 200ms ease}
#enterBtn:hover,#worksBtn:hover{background:var(--ground-2);border-color:var(--ink)}
.th-doors{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#worksBtn{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;
  padding:13px 20px;background:transparent;border:1px solid var(--rule);color:var(--ink);
  cursor:pointer;border-radius:2px}
#worksBtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#enterBtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.th-hint{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--ink-subtle);
  margin:22px 0 0;max-width:44ch;line-height:1.6}
@media (max-width:767px){ .th-in{text-align:left} }

/* the reading environment — a document, unchanged in character from V1 */
#reader{position:fixed;inset:0;z-index:30;background:var(--ground-0);overflow-y:auto;
  visibility:hidden;opacity:0;transition:opacity 320ms ease}
#reader.on{visibility:visible;opacity:1}
.doc{max-width:34rem;margin:0 auto;padding:14vh 24px 18vh}
.dochead{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-subtle);margin:0 0 26px;display:flex;justify-content:space-between}
.docbody{font-family:var(--serif);font-size:clamp(24px,2.6vw,34px);line-height:1.32;
  letter-spacing:-.02em;margin:0 0 30px}
.docplate{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink-subtle);
  border-top:1px solid var(--line);padding-top:14px}
.docplate b{font-weight:400;color:var(--ink-muted)}
#readClose{margin-top:34px;font:inherit;font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  background:none;border:1px solid var(--line);color:var(--ink-muted);padding:11px 15px;
  min-height:44px;cursor:pointer;border-radius:3px}
#readClose:hover{border-color:var(--ink-subtle);color:var(--ink)}
#readClose:focus-visible{outline:2px solid var(--focus);outline-offset:1px}

/* ── THE MANUAL ───────────────────────────────────────────────────────────
   MY WORKS is a layer over the canvas, exactly as #reader is, so the scene is
   never rebuilt and can be paused while this is open. It is the inverse of
   the mind on every axis that matters: paper instead of space, still instead
   of drifting, numbered instead of wandered. One monospace face at three
   sizes; one spot red, rationed. See WORKS-MANUAL-SPEC §4. */
/* ABOVE THE THRESHOLD (z-index 40), because the manual opens FROM the
   threshold and the threshold is therefore still standing behind it. */
#works{position:fixed;inset:0;z-index:46;overflow-y:auto;
  background:var(--paper);color:var(--paper-ink);font-family:var(--mono);
  visibility:hidden;opacity:0;transition:opacity 260ms ease}
#works.on{visibility:visible;opacity:1}
/* and everything behind it goes inert — out of the tab order and out of the
   accessibility tree — so a modal layer is actually modal */
/* display:none, not visibility:hidden. #threshold TRANSITIONS visibility, so
   a hidden threshold still computes as 'visible' until the transition ends —
   which is both a measurement trap and a real half-second during which the
   door behind the manual is still in the tab order. */
body.works-open #threshold,
body.works-open #semantic,
body.works-open #skip,
body.works-open .ctl{display:none}
:root{--paper:#e9e9e4;--paper-ink:#1a1d1f;--paper-dim:#5e6367;--paper-rule:#b9bcb6;
  --paper-spot:#9a2a1f}
.wk-in{max-width:920px;margin:0 auto;padding:34px 30px 0}
@media (max-width:760px){ .wk-in{padding:24px 18px 0} }

.wk-bar{display:flex;justify-content:space-between;align-items:center;gap:14px;
  border-bottom:1.5px solid var(--paper-ink);padding-bottom:10px;flex-wrap:wrap}
.wk-bar-l{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--paper-dim)}
.wk-btn{font:inherit;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  background:transparent;border:1px solid var(--paper-ink);color:var(--paper-ink);
  padding:9px 13px;min-height:44px;cursor:pointer;border-radius:1px}
.wk-btn:hover{background:var(--paper-ink);color:var(--paper)}
.wk-btn:focus-visible{outline:2px solid var(--paper-spot);outline-offset:2px}
.wk-btns{display:flex;gap:8px;flex-wrap:wrap}

/* contents */
.wk-lede{font-size:13px;line-height:1.7;max-width:52ch;margin:26px 0 30px;color:var(--paper-ink)}
.wk-toc{list-style:none;margin:0;padding:0;border-top:1px solid var(--paper-rule)}
.wk-toc li{border-bottom:1px solid var(--paper-rule)}
.wk-toc button{width:100%;text-align:left;background:none;border:0;cursor:pointer;
  font:inherit;color:var(--paper-ink);padding:16px 4px;display:grid;
  /* minmax(0,1fr), not 1fr: a plain 1fr refuses to shrink below its content's
     min-content width, and the graph's sentence for a work is long enough to
     push the state column off the right edge of a narrow window. */
  grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:baseline}
.wk-toc button:hover{background:#e0e0da}
.wk-toc button:focus-visible{outline:2px solid var(--paper-spot);outline-offset:-2px}
.wk-no{font-size:11px;color:var(--paper-spot)}
.wk-ttl{font-size:15px;letter-spacing:.03em;text-transform:uppercase;min-width:0}
.wk-sub{font-size:11px;color:var(--paper-dim);line-height:1.55;margin-top:5px;
  grid-column:2;text-transform:none;letter-spacing:0;overflow-wrap:break-word;min-width:0}
.wk-state{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--paper-dim);
  white-space:nowrap}
.wk-state.latent{color:var(--paper-spot)}

/* a sheet */
.wk-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  flex-wrap:wrap;border-bottom:1.5px solid var(--paper-ink);padding-bottom:10px;margin-top:26px}
.wk-proc{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--paper-dim)}
.wk-name{font-size:26px;letter-spacing:.02em;font-weight:600;margin:4px 0 0;text-transform:uppercase}
.wk-stamp{border:1.5px solid var(--paper-spot);color:var(--paper-spot);font-size:10px;
  letter-spacing:.16em;padding:5px 9px;text-transform:uppercase;transform:rotate(-3deg)}
.wk-line{font-size:13px;line-height:1.68;max-width:56ch;margin:18px 0 0}
.wk-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:6px}
@media (max-width:760px){ .wk-grid{grid-template-columns:1fr} }
.wk-col{padding:18px 22px 18px 0;border-right:1px solid var(--paper-rule)}
.wk-col:last-child{border-right:0;padding:18px 0 18px 22px}
@media (max-width:760px){
  .wk-col{border-right:0;border-bottom:1px solid var(--paper-rule);padding:18px 0}
  .wk-col:last-child{padding:18px 0 0;border-bottom:0}
}
.wk-h{font-size:10.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--paper-dim);margin:0 0 8px}
#works p{margin:0 0 14px;font-size:13px;line-height:1.68;max-width:46ch}
.wk-steps{margin:0 0 16px;padding:0;list-style:none;counter-reset:s}
.wk-steps li{counter-increment:s;font-size:13px;line-height:1.6;padding:0 0 0 26px;
  position:relative;margin:0 0 9px}
.wk-steps li::before{content:counter(s,decimal-leading-zero);position:absolute;left:0;top:0;
  color:var(--paper-spot);font-size:11px}
.wk-parts{list-style:none;margin:0 0 14px;padding:0}
.wk-parts li{font-size:13px;line-height:1.6;padding:0 0 0 26px;position:relative;margin:0 0 9px}
.wk-parts li b{position:absolute;left:0;top:0;color:var(--paper-spot);font-size:11px;font-weight:400}
.wk-failwrap{border-top:1px solid var(--paper-rule);margin-top:6px;padding-top:16px}
/* Two up where there is room. Four failures in a single column is a wall, and
   the entries are independent of one another — they are not steps, so they do
   not have to be read in order. */
.wk-fail{list-style:none;margin:0;padding:0;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:0 34px}
.wk-fail li{font-size:12.5px;line-height:1.55;padding:9px 0;border-bottom:1px dotted var(--paper-rule)}
.wk-fail b{display:block;font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--paper-spot);font-weight:400;margin-bottom:3px}
.wk-none{font-size:12px;line-height:1.7;color:var(--paper-dim);border-left:2px solid var(--paper-rule);
  padding-left:12px;margin:0}

/* the figure */
.wk-fig{border-top:1px solid var(--paper-rule);margin-top:6px;padding-top:14px}
.wk-figbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px;
  flex-wrap:wrap}
.wk-cap{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--paper-dim)}
.wk-figscroll{overflow-x:auto}
.wk-svg{width:100%;min-width:520px;height:auto;display:block}
.wk-svg .part{transition:transform 620ms cubic-bezier(.22,.61,.36,1)}
.wk-svg .lead{opacity:0;transition:opacity 400ms ease}
.wk-svg.exploded .p1{transform:translate(0,-16px)}
.wk-svg.exploded .p2{transform:translate(0,-4px)}
.wk-svg.exploded .p3{transform:translate(0,10px)}
.wk-svg.exploded .p4{transform:translate(0,26px)}
/* An ASSEMBLY explodes differently from a ROW. The five inputs are already
   stacked, so staggering them downward would only compress the stack; they
   step apart and away from the thing they compose into instead. Offsets are
   kept inside the viewBox — an exploded part that leaves it is simply
   clipped, which reads as a missing part. */
.wk-svg--stack.exploded .p1{transform:translate(-16px,-12px)}
.wk-svg--stack.exploded .p2{transform:translate(-16px,-6px)}
.wk-svg--stack.exploded .p3{transform:translate(-16px,0)}
.wk-svg--stack.exploded .p4{transform:translate(-16px,6px)}
.wk-svg--stack.exploded .p5{transform:translate(-16px,12px)}
.wk-svg.exploded .lead{opacity:1}

/* the operable diagnostic — COTSI only, and it earns it */
.wk-run{border-top:1px solid var(--paper-rule);margin-top:20px;padding-top:16px}
.wk-q{font-size:14px;line-height:1.55;max-width:48ch;margin:0 0 14px}
.wk-prog{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--paper-dim);margin:0 0 10px}
.wk-course{list-style:none;margin:12px 0 0;padding:0;counter-reset:c}
.wk-course li{counter-increment:c;position:relative;padding:8px 0 8px 34px;font-size:13px;
  border-bottom:1px solid var(--paper-rule);line-height:1.5}
.wk-course li:last-child{border-bottom:0}
.wk-course li::before{content:"M" counter(c);position:absolute;left:0;top:8px;font-size:10.5px;
  color:var(--paper-dim)}
.wk-course li.skipped{color:#8d918c;text-decoration:line-through}

/* the title block, and the band of night that is the way back */
.wk-plate{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
  border-top:1px solid var(--paper-rule);margin-top:22px;padding-top:12px;
  font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--paper-dim)}
.wk-night{margin:26px -30px 0;padding:20px 30px 24px;background:#0a0e14;position:relative}
@media (max-width:760px){ .wk-night{margin:22px -18px 0;padding:18px 18px 20px} }
.wk-night h3{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#7c8da6;
  margin:0 0 12px;font-weight:400}
.wk-see{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.wk-see button{width:100%;text-align:left;background:none;border:0;cursor:pointer;font:inherit;
  color:#c6d4e6;padding:0}
.wk-see button:hover .wk-see-n{border-bottom-color:#c6d4e6}
.wk-see button:focus-visible{outline:2px solid #7fb2ff;outline-offset:3px}
.wk-see-n{font-size:12px;letter-spacing:.09em;text-transform:uppercase;
  border-bottom:1px solid rgba(198,212,230,.28);padding-bottom:2px;display:inline-block}
.wk-see-v{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#7386a0;
  margin:7px 0 0;display:block}
.wk-see-s{font-size:12px;line-height:1.6;color:#8b9bb2;margin:6px 0 0;max-width:60ch;
  text-transform:none;letter-spacing:0;display:block}
.wk-dot{width:7px;height:7px;border-radius:50%;background:#7fb2ff;display:inline-block;
  margin-right:9px;vertical-align:middle;box-shadow:0 0 10px 2px rgba(127,178,255,.5)}
.wk-foot{height:60px}

@media (max-width:767px){
  #semantic{top:auto;bottom:0;width:100%;max-height:58vh;background:var(--ground-0);
    border-top:1px solid var(--line);padding:16px 18px 30px}
  #where{font-size:27px}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:1ms!important}
}
</style>

<a id="skip" href="#semantic">Skip to the structure</a>

<div id="threshold">
  <div class="th-in">
    <p class="th-eyebrow">An externalised mind</p>
    <h1 class="th-name">Siddhesh Thapa</h1>
    <p class="th-facts" id="thFacts"></p>
    <div class="th-doors">
      <button id="worksBtn" type="button">My works</button>
      <button id="enterBtn" type="button">Enter the mind <span aria-hidden="true">&rarr;</span></button>
    </div>
    <p class="th-hint">Nothing here is a menu. Regions that share thinking sit closer together.</p>
  </div>
</div>
<canvas id="gl" aria-hidden="true"></canvas>

<nav id="semantic" aria-label="Where you are and what it connects to">
  <h1 id="tier">The mind of</h1>
  <p id="where">Siddhesh Thapa</p>
  <p id="gloss"></p>
  <div id="groups"></div>
</nav>
<div id="status" role="status" aria-live="polite"></div>

<button class="ctl" id="backBtn" title="Back" aria-label="Back one step" hidden>&lt;</button>
