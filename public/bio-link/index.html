:root {
  /* DARK (the default): the page we built first */
  --bg: #101118; --bg-0: rgba(16, 17, 24, 0); --panel: #14151d; --line: #2B2E3D; --fg: #F2EFE7; --muted: #9DA1B8;
  --blue: #7C84FF; --red: #F66C88; --ink: #14151B;
  --hover: rgba(242, 239, 231, .06); --current: #1f2131; --scrim: rgba(5, 6, 10, .62); --raised: #1b1d28; --pin-bg: #161827; --hard: #07080b;
  --ring-bg: #1c1e2a; --go-red: var(--red); --go-blue: var(--blue); --glow-a: .24; --glow-b: .07; --dim: .2; --dim-cap: .32; --slab-op: .62;
  /* the monuments: face fade (3 stops), outline, body */
  --red-f0: #F66C88; --red-f1: #3a2530; --red-f2: #1c1d28; --red-line: #F66C88; --red-body: #07080b;
  --blue-f0: #7C84FF; --blue-f1: #252842; --blue-f2: #1a1b26; --blue-line: #7C84FF; --blue-body: #07080b;
  --slab-face: #1b1d28; --slab-line: #2B2E3D; --slab-body: #07080b; --slab-q: #9DA1B8;
  --bar: 60px;
  --mh: clamp(230px, 44vh, 380px);          /* the height of one monument's slot */
  --edge: calc(50vh - var(--mh) / 2);        /* space above the first and below the last, so each can sit in the centre */
  color-scheme: dark;
}
@supports (height: 1svh) { :root { --mh: clamp(230px, 44svh, 380px); --edge: calc(50svh - var(--mh) / 2); } }

/* LIGHT: the My Works palette from siddheshthapa.com (paper #e9e9e4, ink #1a1d1f, dim #5e6367, rule #b9bcb6) */
:root[data-look="light"] {
  --bg: #e9e9e4; --bg-0: rgba(233, 233, 228, 0); --panel: #eceae4; --line: #b9bcb6; --fg: #1a1d1f; --muted: #5e6367;
  --hover: rgba(26, 29, 31, .06); --current: rgba(26, 29, 31, .09); --scrim: rgba(26, 29, 31, .3); --raised: #eceae4; --pin-bg: #eceae4; --hard: #1a1d1f;
  --ring-bg: #d9d9d3; --go-red: #1a1d1f; --go-blue: #1a1d1f; --glow-a: .2; --glow-b: .06; --dim: .26; --dim-cap: .45; --slab-op: .7;
  --slab-face: #eceae4; --slab-line: #b9bcb6; --slab-body: #1a1d1f; --slab-q: #5e6367;
  color-scheme: light;
  /* the monuments in light, "Stencil" (his pick, 17 Nov): paper face, brand outline, ink body */
  --red-f0: #f7f6f2; --red-f1: #efeee9; --red-f2: #e2e1db; --red-line: #F66C88; --red-body: #1a1d1f;
  --blue-f0: #f7f6f2; --blue-f1: #efeee9; --blue-f2: #e2e1db; --blue-line: #7C84FF; --blue-body: #1a1d1f;
}
/* each monument picks its tone's colours */
.tone-red { --m-f0: var(--red-f0); --m-f1: var(--red-f1); --m-f2: var(--red-f2); --m-line: var(--red-line); --m-body: var(--red-body); }
.tone-blue { --m-f0: var(--blue-f0); --m-f1: var(--blue-f1); --m-f2: var(--blue-f2); --m-line: var(--blue-line); --m-body: var(--blue-body); }
* { box-sizing: border-box; }
html { background: var(--bg); transition: background-color .3s; scroll-snap-type: y mandatory; -webkit-text-size-adjust: 100%; }
html.lock { overflow: hidden; }
body { margin: 0; overflow-x: hidden; background: var(--bg); color: var(--fg); transition: background-color .3s, color .3s; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; }
.new { display: inline-block; flex: none; background: var(--red); color: var(--ink); font: 700 12.5px/1 "Rajdhani", "Arial Narrow", sans-serif; letter-spacing: .1em; padding: 4px 7px 3px; border-radius: 6px; }

/* ---------- the bar at the top ---------- */
.top {
  position: fixed; z-index: 20; top: 0; left: 0; right: 0; height: calc(var(--bar) + env(safe-area-inset-top));
  padding: env(safe-area-inset-top) 8px 0 6px; display: flex; align-items: center; gap: 2px;
  background: linear-gradient(var(--bg) 58%, var(--bg-0));
}
.panel-btn, .panel-close { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border-radius: 10px; color: var(--fg); }
.panel-btn:hover, .panel-close:hover, .who:hover, .theme-btn:hover { background: var(--hover); }
/* the theme switch: always in the top-right corner. Shows the sun in dark (go light), the moon in light (go dark) */
.theme-btn { margin-left: auto; width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: 10px; color: var(--fg); }
.theme-btn .i-moon, :root[data-look="light"] .theme-btn .i-sun { display: none; }
:root[data-look="light"] .theme-btn .i-moon { display: block; }
.no-js .theme-btn { display: none; }
.no-js .panel-btn { display: none; }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; height: 44px; padding: 0 8px 0 6px; border-radius: 10px; }
.ring { width: 31px; height: 31px; flex: none; border-radius: 50%; border: 1.5px solid var(--blue); background: var(--ring-bg); overflow: hidden; }
.ring img { display: block; width: 100%; height: 100%; object-fit: cover; }
.name { font: 700 19px/1 "Rajdhani", "Arial Narrow", sans-serif; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* MY MIND, turned into a small button once you scroll past it */
/* out of the row, left of the theme switch: while hidden it takes no room from the name; when it shows, the name gives way */
.top.pin-on .who { max-width: calc(100vw - 172px); }   /* 52px before it; 8 + 40 + 6 for the switch, ~60 for the button, a gap */
.pin {
  position: absolute; right: 54px; top: calc(env(safe-area-inset-top) + (var(--bar) - 36px) / 2); flex: none; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 11px 0 12px;
  border: 1.5px solid var(--blue); border-radius: 10px; background: var(--pin-bg); box-shadow: 3px 3px 0 var(--hard);
  font: 700 16px/1 "Rajdhani", "Arial Narrow", sans-serif; letter-spacing: .05em; color: var(--fg);
  opacity: 0; visibility: hidden; transform: translateY(26px) scale(.55); transform-origin: 100% 50%;
  transition: opacity .25s, transform .3s ease-in, visibility 0s .3s;
}
.pin span:last-child { color: var(--blue); }
.pin.show { opacity: 1; visibility: visible; transform: none; transition: opacity .25s, transform .45s cubic-bezier(.2, 1.5, .4, 1), visibility 0s; }

/* ---------- the side panel ---------- */
.scrim { position: fixed; inset: 0; z-index: 30; background: var(--scrim); opacity: 0; visibility: hidden; transition: opacity .25s, visibility 0s .25s; }
.scrim.open { opacity: 1; visibility: visible; transition: opacity .25s; }
.panel {
  position: fixed; z-index: 31; top: 0; bottom: 0; left: 0; width: min(300px, 84vw); display: flex; flex-direction: column;
  background: var(--panel); border-right: 1px solid var(--line); padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  transform: translateX(-102%); visibility: hidden; transition: transform .3s cubic-bezier(.2, .8, .2, 1), visibility 0s .3s; overscroll-behavior: contain;
}
.panel.open { transform: none; visibility: visible; transition: transform .3s cubic-bezier(.2, .8, .2, 1); }
.panel-head { display: flex; align-items: center; justify-content: space-between; height: var(--bar); flex: none; padding: 0 6px 0 20px; }
.panel-title { font: 600 11.5px/1 system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.p-list { list-style: none; margin: 0; padding: 2px 8px 20px; overflow-y: auto; flex: 1; }
.p-item { display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 8px 12px; border-radius: 10px; font: 700 18px/1.15 "Rajdhani", "Arial Narrow", sans-serif; letter-spacing: .01em; }
.p-item:hover { background: var(--hover); }
.p-item[aria-current="true"] { background: var(--current); }
.p-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-dot { width: 9px; height: 9px; flex: none; transform: rotate(45deg); background: var(--blue); }
.p-dot.tone-red { background: var(--red); }
.p-q { width: 9px; margin-right: 3px; flex: none; text-align: center; font: 700 17px/1 "Rajdhani", sans-serif; color: var(--muted); }
.p-item.soon { color: var(--muted); }
.p-item .new { margin-left: auto; }

/* ---------- the monuments ---------- */
.stack { overflow-x: clip; }   /* the glows are wider than the screen: never let them make the page scroll sideways */
.lead { height: var(--edge); max-width: 600px; margin: 0 auto; padding: 0 16px 10px; display: flex; align-items: flex-end; }
.tail { height: var(--edge); }
.mon { position: relative; height: var(--mh); display: flex; flex-direction: column; justify-content: center; scroll-snap-align: center; scroll-snap-stop: always; }
.mon::before {   /* the coloured glow behind the lit monument */
  content: ""; position: absolute; z-index: 0; left: 50%; top: 50%; width: min(150vw, 980px); height: 125%; transform: translate(-50%, -50%);
  background: radial-gradient(closest-side, rgba(var(--glow), var(--glow-a)), rgba(var(--glow), var(--glow-b)) 55%, rgba(var(--glow), 0)); pointer-events: none;
  opacity: 0; transition: opacity .45s;
}
.no-js .mon::before, .mon.active::before { opacity: 1; }
.cv { position: absolute; z-index: 1; left: 0; top: 0; width: 100%; pointer-events: none; }
.mon > .cap, .mon > .word { position: relative; z-index: 2; width: 100%; max-width: 600px; margin-left: auto; margin-right: auto; padding-left: 16px; padding-right: 16px; }
.word { display: block; }
.plain { display: block; height: auto; overflow: visible; }
.plain .s0 { stop-color: var(--m-f0); } .plain .s1 { stop-color: var(--m-f1); } .plain .s2 { stop-color: var(--m-f2); }
.plain .pb { fill: var(--m-body); } .plain .pf { stroke: var(--m-line); }
.plain .sb { fill: var(--slab-body); } .plain .sf { fill: var(--slab-face); stroke: var(--slab-line); } .plain .sw { stroke: var(--slab-line); } .plain .sq { fill: var(--slab-q); }
.word .plain { width: min(calc((100vw - 32px) * .78 - 14px), calc(24vh * var(--ar)), 440px); }
.word.big .plain { width: min(calc(100vw - 50px), calc(34vh * var(--ar)), 552px); }
.cap { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 13.5px; line-height: 1.35; color: var(--muted); }
.cap-top { margin-bottom: 14px; }
.cap-bottom { margin-top: 14px; }
.line { min-width: 0; }
.go { margin-left: auto; flex: none; padding: 6px 0 6px 8px; font: 700 15px/1 "Rajdhani", "Arial Narrow", sans-serif; letter-spacing: .03em; white-space: nowrap; }
.tone-red .go { color: var(--go-red); }
.tone-blue .go { color: var(--go-blue); }

/* lit vs dimmed (only with JS: without it everything stays lit) */
.js .mon .word, .js .mon .cv, .js .mon .cap { transition: opacity .4s ease; }
.js .mon .go { opacity: 0; pointer-events: none; transition: opacity .3s; }
.js .mon.active .go { opacity: 1; pointer-events: auto; }
.js .mon.dim .word, .js .mon.dim .cv { opacity: var(--dim); }
.js .mon.dim .cap { opacity: var(--dim-cap); }
.js .mon.pinned .word, .js .mon.pinned .cv, .js .mon.pinned .cap { opacity: 0; }
.js .mon.pinned::before { opacity: 0; }
.js .mon.active .word:active { transform: translateY(1px); }

/* the plain version: shown at once without JS; with JS it waits for the 3D, and still appears
   after 1.2 s if the 3D never draws, so the page can never end up empty */
.js .plain { opacity: 0; animation: plain-in 0s 1.2s forwards; }
.js .drawn .plain { opacity: 0; animation: none; }
.js.plain-mode .plain { opacity: 1; animation: none; }
@keyframes plain-in { to { opacity: 1; } }

/* ---------- coming soon: the wrapped slab ---------- */
.soon { position: relative; display: block; width: min(74vw, 300px); margin-left: 14px; opacity: var(--slab-op); transition: opacity .3s; }
.soon:hover { opacity: 1; }
.soon .plain { width: 100%; }
.soon .cv { left: 0; top: 0; width: auto; }
.soon.shake { animation: shake .5s; }
@keyframes shake { 15% { transform: translateX(-7px) rotate(-1.2deg); } 35% { transform: translateX(6px) rotate(.9deg); } 55% { transform: translateX(-4px) rotate(-.5deg); } 75% { transform: translateX(2px); } }

/* ---------- small things ---------- */
.toast {
  position: fixed; z-index: 40; left: 50%; top: calc(var(--bar) + env(safe-area-inset-top) + 8px); transform: translate(-50%, -6px); opacity: 0; pointer-events: none;
  width: max-content; max-width: calc(100vw - 40px); padding: 10px 14px; border-radius: 12px; background: var(--raised); color: var(--fg); border: 1px solid var(--line);
  font: 700 16px/1.25 "Rajdhani", "Arial Narrow", sans-serif; text-align: center; transition: opacity .3s, transform .3s;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.debug { position: fixed; z-index: 50; right: 8px; bottom: 8px; margin: 0; font: 12px/1.3 ui-monospace, monospace; background: rgba(0, 0, 0, .75); padding: 4px 6px; border-radius: 6px; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) {
  .pin, .pin.show, .panel, .panel.open, .scrim, .scrim.open, .js .mon .word, .js .mon .cv, .js .mon .cap { transition-duration: .01s; }
  .soon.shake { animation: none; }
}
</style>

<script>/* The Monument page.
   1. Draws each monument as a solid 3D word in the sketch's style: a face with a colour fade and a
      bright outline, and a hard black body going back into the screen. Real perspective: the eye sits
      down and to the right, so the body shows down-right, and it changes as you scroll or tilt.
      Plain 2D canvas, no WebGL: a flat face at one depth is just a scaled copy, so only the side walls
      need maths. Faces are always in front of every side wall, so: all bodies first, then all faces.
   2. The monument in the middle of the screen is lit; the others are dimmed.

  function eye() {
    var vw = innerWidth, vh = innerHeight, col = Math.min(vw, 600);
    return { x: vw / 2 + col * (1.1 + 0.75 * look.x), y: vh * (1.1 + 0.4 * look.y), D: 1.6 * Math.max(vh, 700) };
  }

  /* ---------- drawing one shape ---------- */
  function render(sh, E, now) {
    var r = sh.svg.getBoundingClientRect();
    if (r.width === 0 || r.bottom < -80 || r.top > innerHeight + 80) return false;
    var c = sh.cv.getBoundingClientRect(), g = sh.ctx, d = sh.d;
    var s = r.width / d.w;
    var depthFull = (sh.kind === 'block' ? 0.3 : 0.4) * r.height;
    var stroke = sh.kind === 'block' ? 1 : Math.max(1.2, 0.016 * r.height);
    if (sh.t0 < 0) sh.t0 = sh.noIntro ? now - 99999 : now;
    var time = (now - sh.t0) / 1000, anim = false, n = sh.letters.length, i, L;
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.clearRect(0, 0, sh.cssW, sh.cssH);
    // where each letter is in its arrival: it fades in, drops into place, and its body grows out of the wall
    var st = [];
    for (i = 0; i < n; i++) {
      var k = REDUCED ? 1 : clamp01((time - 0.08 - i * 0.07) / 0.6);
      if (k < 1) anim = true;
      st.push({ k: k, dep: depthFull * backOut(k), drop: -(1 - easeOut(k)) * 0.14 * r.height, a: clamp01(k * 2.4) });
    }
    // plane of depth z: a scaled copy of the word, scaled about the eye
    function plane(dep, drop) {
      var t = E.D / (E.D + dep);
      return { sc: t * s, ox: E.x * (1 - t) + t * r.left - c.left, oy: E.y * (1 - t) + t * (r.top + drop) - c.top };
    }
    // pass 1: bodies (back face + side walls), all in one flat black
    g.fillStyle = sh.col.body; g.strokeStyle = sh.col.body; g.lineJoin = 'round'; g.lineWidth = 1;
    for (i = 0; i < n; i++) {
      var S = st[i]; if (S.a <= 0) continue;
      L = sh.letters[i];
      var F = plane(0, S.drop), B = plane(S.dep, S.drop);
      g.globalAlpha = S.a;
      g.setTransform(DPR * B.sc, 0, 0, DPR * B.sc, DPR * B.ox, DPR * B.oy);
      g.fill(L.path);
      g.setTransform(DPR, 0, 0, DPR, 0, 0);
      g.beginPath();
      L.contours.forEach(function (p) {
        var m = p.length;
        for (var j = 0; j < m; j += 2) {
          var ax = p[j], ay = p[j + 1], bx = p[(j + 2) % m], by = p[(j + 3) % m];
          var x0 = F.sc * ax + F.ox, y0 = F.sc * ay + F.oy, x1 = F.sc * bx + F.ox, y1 = F.sc * by + F.oy;
          var x2 = B.sc * bx + B.ox, y2 = B.sc * by + B.oy, x3 = B.sc * ax + B.ox, y3 = B.sc * ay + B.oy;
          // every wall wound the same way, so one "nonzero" fill covers them all with no seams
          var area = (x0 * y1 - x1 * y0) + (x1 * y2 - x2 * y1) + (x2 * y3 - x3 * y2) + (x3 * y0 - x0 * y3);
          if (area >= 0) { g.moveTo(x0, y0); g.lineTo(x1, y1); g.lineTo(x2, y2); g.lineTo(x3, y3); }
          else { g.moveTo(x0, y0); g.lineTo(x3, y3); g.lineTo(x2, y2); g.lineTo(x1, y1); }
          g.closePath();
        }
      });
      g.fill(); g.stroke();
    }
    // pass 2: faces, always in front
    for (i = 0; i < n; i++) {
      var S2 = st[i]; if (S2.a <= 0) continue;
      L = sh.letters[i];
      var P = plane(0, S2.drop);
      g.globalAlpha = S2.a;
      g.setTransform(DPR * P.sc, 0, 0, DPR * P.sc, DPR * P.ox, DPR * P.oy);
      g.fillStyle = sh.fill; g.fill(L.path);
      g.lineWidth = stroke / P.sc; g.strokeStyle = sh.col.line; g.lineJoin = 'round'; g.stroke(L.path);
      if (sh.kind === 'block') drawSlabFace(g, P.sc, sh.col);
    }
    g.globalAlpha = 1;
    if (!sh.drawn) { sh.drawn = true; sh.host.classList.add('drawn'); }
    return anim;
  }
  // the slab's face: two faint waves and a question mark (in the slab's own 266 x 76 units)
  function drawSlabFace(g, sc, col) {
    g.lineWidth = 1 / sc; g.strokeStyle = col.line;
    g.beginPath();
    g.moveTo(0, 24); g.quadraticCurveTo(60, 36, 133, 24); g.quadraticCurveTo(206, 12, 266, 24);
    g.moveTo(0, 52); g.quadraticCurveTo(70, 42, 133, 52); g.quadraticCurveTo(196, 62, 266, 52);
    g.stroke();
    g.font = '700 34px Rajdhani, "Arial Narrow", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    g.fillStyle = col.q; g.fillText('?', 133, 49);
  }

  /* ---------- render loop: only while something moves ---------- */
  var running = false;
  function frame(now) {
    running = false;
    if (document.hidden) return;
    look.x += (look.tx - look.x) * 0.14; look.y += (look.ty - look.y) * 0.14;
    var E = eye(), anim = false, t0 = performance.now();
    shapes.forEach(function (sh) { if (sh.ctx && render(sh, E, now)) anim = true; });
    if (DEBUG) { debugEl.hidden = false; debugEl.textContent = (performance.now() - t0).toFixed(1) + ' ms/frame'; }
    if (anim || Math.abs(look.tx - look.x) > 0.002 || Math.abs(look.ty - look.y) > 0.002) request();
  }
  function request() {
    if (running) return;
    running = true;
    if (REDUCED) frame(performance.now()); else requestAnimationFrame(frame);
  }

  /* ---------- which monument is lit ---------- */
  var active = null;
  var panel = $('panel'), scrim = $('scrim'), panelBtn = $('panel-btn'), panelClose = $('panel-close');
  var items = panel ? [].slice.call(panel.querySelectorAll('.p-item')) : [];
  function pickActive() {
    var mid = innerHeight / 2, best = null, bd = Infinity;
    mons.forEach(function (m) {
      var r = m.sec.getBoundingClientRect(), dd = Math.abs(r.top + r.height / 2 - mid);
      if (dd < bd) { bd = dd; best = m; }
    });
    if (best && best !== active) {
      active = best;
      mons.forEach(function (m) {
        var on = m === active, past = !!(homeMon && m === homeMon && active.i > homeMon.i);
        m.sec.classList.toggle('active', on);
        m.sec.classList.toggle('dim', !on && !past);
        m.sec.classList.toggle('pinned', past);
      });
      items.forEach(function (it) {
        if (it.getAttribute('data-target') === 'm-' + active.d.id) it.setAttribute('aria-current', 'true'); else it.removeAttribute('aria-current');
      });
    }
    // MY MIND becomes the top-right button once you are past it
    var showPin = !!(homeMon && active && active.i > homeMon.i);
    if (pin && pin.classList.contains('show') !== showPin) {
      pin.classList.toggle('show', showPin);
      topbar.classList.toggle('pin-on', showPin);
      pin.tabIndex = showPin ? 0 : -1;
      pin.setAttribute('aria-hidden', showPin ? 'false' : 'true');
    }
  }
  function centerOn(el) { el.scrollIntoView({ block: 'center', behavior: REDUCED ? 'auto' : 'smooth' }); }

  /* tapping a dimmed monument brings it to the middle; tapping the lit one opens it */
  mons.forEach(function (m) {
    [m.link, m.go].forEach(function (a) {
      if (!a) return;
      a.addEventListener('click', function (e) {
        if (m !== active) { e.preventDefault(); centerOn(m.sec); return; }
        if (COARSE && navigator.vibrate) { try { navigator.vibrate(10); } catch (x) {} }
      });
    });
    m.link.addEventListener('focus', function () { if (m !== active) centerOn(m.sec); });
  });

  /* ---------- coming soon ---------- */
  var toastTimer;
  function toast(text) {
    if (!toastEl) return;
    toastEl.textContent = text; toastEl.classList.add('on');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { toastEl.classList.remove('on'); }, 2600);
  }
  function notYet() {
    if (soonEl) { soonEl.classList.remove('shake'); void soonEl.offsetWidth; soonEl.classList.add('shake'); }
    toast("Not yet. It's still being built.");
  }
  if (soonEl) soonEl.addEventListener('click', notYet);

  /* ---------- the side panel ---------- */
  function isOpen() { return !!panel && panel.classList.contains('open'); }
  function openPanel(byKey) {
    panel.classList.add('open'); scrim.classList.add('open'); panel.removeAttribute('inert');
    panelBtn.setAttribute('aria-expanded', 'true'); root.classList.add('lock');
    // keyboard users land inside the panel; touch and mouse users get no focus ring
    var first = panel.querySelector('[aria-current="true"]') || items[0];
    if (byKey) setTimeout(function () { if (first && isOpen()) first.focus({ preventScroll: true }); }, 60);
  }
  function closePanel(focusBtn) {
    panel.classList.remove('open'); scrim.classList.remove('open'); panel.setAttribute('inert', '');
    panelBtn.setAttribute('aria-expanded', 'false'); root.classList.remove('lock');
    if (focusBtn) panelBtn.focus({ preventScroll: true });
  }
  if (panel) {
    panelBtn.addEventListener('click', function (e) { if (isOpen()) closePanel(true); else openPanel(e.detail === 0); });
    panelClose.addEventListener('click', function () { closePanel(true); });
    scrim.addEventListener('click', function () { closePanel(true); });
    document.addEventListener('keydown', function (e) {
      if (!isOpen()) return;
      if (e.key === 'Escape') { e.preventDefault(); closePanel(true); return; }
      if (e.key === 'Tab') {   // keep the keyboard inside the panel while it is open
        var f = [panelClose].concat(items), idx = f.indexOf(document.activeElement);
        e.preventDefault();
        if (idx < 0) idx = e.shiftKey ? 0 : -1;
        f[(idx + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
      }
    });
    items.forEach(function (it) {
      it.addEventListener('click', function (e) {
        e.preventDefault();
        var byKey = e.detail === 0;
        closePanel(false);
        if (it.getAttribute('data-soon')) {
          window.scrollTo({ top: 0, behavior: REDUCED ? 'auto' : 'smooth' });
          setTimeout(notYet, REDUCED ? 0 : 450);
          if (byKey && soonEl) soonEl.focus({ preventScroll: true });
          return;
        }
        var target = $(it.getAttribute('data-target'));
        if (!target) return;
        centerOn(target);
        if (byKey) { var link = target.querySelector('.word'); if (link) link.focus({ preventScroll: true }); }
      });
    });
  }

  /* ---------- input ---------- */
  if (!REDUCED) {
    addEventListener('pointermove', function (e) {
      if (e.pointerType !== 'mouse') return;
      look.tx = (e.clientX / innerWidth - 0.5) * 2; look.ty = (e.clientY / innerHeight - 0.5) * 2;
      request();
    }, { passive: true });
    addEventListener('deviceorientation', function (e) {
      if (e.gamma == null) return;
      var tx = Math.max(-1, Math.min(1, e.gamma / 25)), ty = Math.max(-1, Math.min(1, (e.beta - 50) / 25));
      if (Math.abs(tx - look.tx) > 0.03 || Math.abs(ty - look.ty) > 0.03) { look.tx = tx; look.ty = ty; request(); }
    }, { passive: true });
  }
  // dev only: ?debug&look=x,y fakes a tilt (-1..1) for screenshots
  var lm = DEBUG && /[?&]look=(-?[\d.]+),(-?[\d.]+)/.exec(qs);
  if (lm) { look.x = look.tx = +lm[1]; look.y = look.ty = +lm[2]; }

  /* ---------- the theme switch (top right): dark is the default; the choice is remembered on this device ---------- */
  var themeBtn = $('theme-btn'), themeMeta = $('theme-color');
  function isLight() { return root.getAttribute('data-look') === 'light'; }
  function syncThemeUi() {
    var light = isLight();
    if (themeBtn) themeBtn.setAttribute('aria-label', light ? 'Switch to the dark theme' : 'Switch to the light theme');
    if (themeMeta) themeMeta.setAttribute('content', light ? '#e9e9e4' : '#101118');
  }
  if (themeBtn) themeBtn.addEventListener('click', function () {
    var light = !isLight();
    if (light) root.setAttribute('data-look', 'light'); else root.removeAttribute('data-look');
    try { localStorage.setItem('bio-theme', light ? 'light' : 'dark'); } catch (e) {}
    syncThemeUi(); recolor(); request();
  });
  syncThemeUi();

  function relayout() { shapes.forEach(layout); pickActive(); request(); }
  addEventListener('scroll', function () { pickActive(); request(); }, { passive: true });
  addEventListener('resize', relayout);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) request(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);

  // only what is on screen at load gets the arrival; the rest appears already in place
  shapes.forEach(function (sh) {
    var r = sh.svg.getBoundingClientRect();
    sh.noIntro = r.bottom < 0 || r.top > innerHeight;
  });
  relayout();
  // dev only, for screenshots: ?debug&at=<id> starts at that monument, ?debug&panel opens the panel
  if (DEBUG) {
    var at = /[?&]at=([a-z0-9-]+)/.exec(qs);
    if (at && $('m-' + at[1])) { $('m-' + at[1]).scrollIntoView({ block: 'center', behavior: 'auto' }); pickActive(); request(); }
    if (/[?&]panel\b/.test(qs) && panel) openPanel();
  }
})();
</script>
</body>
</html>
