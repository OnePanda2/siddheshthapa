<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Siddhesh Thapa</title>

<style>
  :root{
    /* ── the family: blue · white · black · grey.
       Every world draws from these; only the balance changes. ── */
    --black:#05070A; --near:#080B11; --slate:#101725; --graphite:#222833;
    --navy:#0B1626; --deep:#132239; --blue:#4C8DFF; --blue-dim:#2C5FA6; --pale:#A9C4E8;
    --white:#FFFFFF; --off:#EEF1F5; --grey:#A5AFBD; --grey-2:#6C7686;

    /* per-world tokens — reassigned when a MIG is entered */
    --env:#06080C; --ink:#EEF1F5; --ink-2:#A5AFBD; --ink-3:#6C7686;
    --line:#1E2530; --accent:#4C8DFF; --accent-soft:#2C5FA6;

    --display:'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif;
    --body:-apple-system,'Segoe UI Variable Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    --mono:ui-monospace,'Cascadia Mono','Cascadia Code',Consolas,'SF Mono','Roboto Mono',monospace;

    /* ── the scales ───────────────────────────────────────────────
       Named for what they are for, not for how big they are, so a
       region can be composed from them instead of hand-tuned. */
    --gut:clamp(20px,4vw,64px);        /* the page gutter */
    --inset-y:clamp(16px,2.4vh,26px);  /* controls, from the top edge */
    --inset-x:clamp(16px,2.4vw,30px);  /* controls, from the side edge */
    --space-1:6px; --space-2:11px; --space-3:16px; --space-4:22px;
    --space-5:clamp(18px,3vh,34px); --space-6:clamp(26px,5vh,54px);
    --space-7:clamp(30px,6vh,66px); --space-8:clamp(44px,9vh,96px);

    --dur-instant:.12s;  /* a rule filling as you scroll */
    --dur-quick:.2s;     /* hover, colour */
    --dur-snap:.35s;     /* a small state change */
    --dur-panel:.45s;    /* a panel arriving or leaving */
    --dur-page:.5s;      /* the reading page */
    --dur-world:.8s;     /* crossing into another climate */
    --dur-cross:1s;      /* the threshold */
    --dur-slow:1.2s;     /* a whisper */
    --dur-drift:1.8s;    /* fragments surfacing */

    --ease-out:cubic-bezier(.2,.6,.2,1);   /* the site's one curve */
    --ease-std:ease;
    --ease-linear:linear;

    /* Deliberately empty scales. This design is square, unshadowed and
       unblurred — three acceptance checks enforce it. They are declared
       so that any future exception has to be written down on purpose
       rather than slipped in by habit. */
    --radius-0:0; --shadow-0:none; --blur-0:none;
  }
  *{box-sizing:border-box;border-radius:0}
  html{-webkit-text-size-adjust:100%}
  html,body{height:100%;overflow:hidden}
  body{
    margin:0;background:var(--env);color:var(--ink);
    font-family:var(--body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;
    transition:background var(--dur-world) ease,color var(--dur-world) ease;
  }
  ::selection{background:var(--accent);color:var(--env)}
  :focus-visible{outline:1px solid var(--accent);outline-offset:3px}
  .mono{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}

  .stage{position:fixed;inset:0;background:var(--env);overflow:hidden}
  #graph{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* ══════════════════════════════════════════════════════════════
     THE PARALLEL LAYER

     The graph is a canvas, which means that without this it is a
     picture — 143 ideas and 126 arguments that a keyboard cannot
     reach and a screen reader cannot see.

     So the canvas is demoted to being the VIEW. The structure lives
     here, in real focusable elements, and the canvas mirrors it:
     whatever holds DOM focus is what the canvas rings.

     The keyboard model is the site's own thesis. Arrow keys do not
     walk a tab order — they walk the current view: this idea, then
     everything it is connected to, then the ways out. Following a
     relationship is the only way to move, for everybody.
     ══════════════════════════════════════════════════════════════ */
  .a11y{
    position:absolute;width:1px;height:1px;margin:-1px;padding:0;
    overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);
    white-space:nowrap;border:0;
  }
  .nv-g,.nv-l,.nv-m,.nv-v,.nv-w{display:none}   /* desktop: the layer stays a screen-reader structure */
  .skip{
    position:absolute;z-index:20;top:10px;left:10px;transform:translateY(-250%);
    background:var(--env);color:var(--ink);border:1px solid var(--accent);
    padding:10px 15px;text-decoration:none;
    font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    transition:transform var(--dur-quick) var(--ease-out);
  }
  .skip:focus{transform:none}

  /* Hiding with opacity alone leaves the buttons inside in the tab order,
     so focus walks into a panel nobody can see. visibility removes them,
     delayed so it does not cut the fade short. */
  .emerge,.reader,.threshold{visibility:visible}
  .emerge{transition:opacity var(--dur-page) ease,transform var(--dur-page) var(--ease-out),visibility 0s}
  .emerge:not(.on){visibility:hidden;transition:opacity var(--dur-page) ease,transform var(--dur-page) var(--ease-out),visibility 0s var(--dur-page)}
  .reader:not(.on){visibility:hidden;transition:opacity var(--dur-panel) ease,visibility 0s var(--dur-panel)}
  .threshold.gone{visibility:hidden;transition:opacity var(--dur-cross) var(--ease-out),transform var(--dur-cross) var(--ease-out),visibility 0s var(--dur-cross)}

  /* ── the way back: one mark, top-left, easy to forget until needed ── */
  .back{
    position:absolute;z-index:6;top:var(--inset-y);left:var(--inset-x);
    appearance:none;background:none;border:0;padding:6px 10px 6px 6px;margin:0;cursor:pointer;
    font-family:var(--display);font-size:26px;line-height:1;color:var(--ink-3);
    opacity:0;pointer-events:none;transition:opacity var(--dur-panel) ease,color var(--dur-quick) ease,transform var(--dur-quick) ease;
  }
  .back.on{opacity:1;pointer-events:auto}
  .back:hover{color:var(--ink);transform:translateX(-3px)}

  /* ── the way out: leave this climate entirely, return to the whole mind ── */
  .mindbtn{
    position:absolute;z-index:6;top:var(--inset-y);right:var(--inset-x);
    appearance:none;background:none;border:0;padding:5px;margin:0;cursor:pointer;
    color:var(--ink-3);line-height:0;
    opacity:0;pointer-events:none;transition:opacity var(--dur-panel) ease,color var(--dur-quick) ease;
  }
  .mindbtn.on{opacity:1;pointer-events:auto}
  .mindbtn:hover{color:var(--ink)}
  .mindbtn::after{
    content:attr(data-tip);
    position:absolute;top:calc(100% + 9px);right:0;white-space:nowrap;
    font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-2);background:var(--env);border:1px solid var(--line);padding:5px 9px;
    opacity:0;transform:translateY(-3px);transition:opacity var(--dur-quick) ease,transform var(--dur-quick) ease;pointer-events:none;
  }
  .mindbtn:hover::after,.mindbtn:focus-visible::after{opacity:1;transform:none}

  /* ── the threshold ── */
  .threshold{
    position:absolute;inset:0;z-index:3;
    display:flex;flex-direction:column;justify-content:center;padding:0 var(--gut);
    background:radial-gradient(120% 90% at 50% 45%, rgba(5,7,10,.72) 0%, rgba(5,7,10,.95) 55%, var(--env) 100%);
    transition:opacity var(--dur-cross) var(--ease-out), transform var(--dur-cross) var(--ease-out);
  }
  .threshold.gone{opacity:0;transform:scale(1.06);pointer-events:none}
  .threshold .eyebrow{margin-bottom:var(--space-5)}
  .name{font-family:var(--display);font-weight:400;font-size:clamp(46px,10vw,158px);line-height:.9;letter-spacing:-.025em;margin:0}
  .name em{font-style:normal;display:block}
  .subline{
    font-family:var(--display);font-size:clamp(15px,1.6vw,22px);line-height:1.5;
    color:var(--ink-2);max-width:34ch;margin:clamp(22px,3.4vh,40px) 0 clamp(30px,5vh,58px);
  }
  .subline b{color:var(--ink);font-weight:400}
  .enter{
    appearance:none;background:none;border:0;padding:0;cursor:pointer;
    font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--ink);display:inline-flex;align-items:center;gap:14px;align-self:flex-start;
  }
  .enter .rule{display:block;height:1px;width:56px;background:var(--accent);transition:width var(--dur-panel) var(--ease-out)}
  .enter:hover .rule,.enter:focus-visible .rule{width:104px}
  .enter:hover{color:var(--accent)}
  .frag{
    position:absolute;z-index:2;font-family:var(--display);font-style:italic;
    font-size:clamp(13px,1.15vw,17px);color:var(--ink);opacity:0;
    transition:opacity var(--dur-drift) ease;pointer-events:none;max-width:30ch;
  }
  .frag.on{opacity:.26}

  /* ── content emerging inside the world ── */
  .emerge{
    position:absolute;z-index:4;left:var(--gut);bottom:var(--space-6);
    width:min(560px,calc(100% - var(--gut)*2));
    padding-left:18px;border-left:1px solid var(--accent);
    opacity:0;transform:translateY(14px);pointer-events:none;
    transition:opacity var(--dur-page) ease,transform var(--dur-page) var(--ease-out);
    /* a region with fourteen writings is taller than the screen — let it scroll
       inside itself rather than running off the top of the world */
    max-height:calc(100vh - 290px);overflow-y:auto;overscroll-behavior:contain;
    scrollbar-width:thin;scrollbar-color:var(--line) transparent;
  }
  .emerge::-webkit-scrollbar{width:3px}
  .emerge::-webkit-scrollbar-thumb{background:var(--line)}
  .emerge::-webkit-scrollbar-track{background:transparent}
  .emerge.on{opacity:1;transform:none;pointer-events:auto}
  .emerge .kind{display:block;margin-bottom:12px}
  .emerge .kind i{font-style:normal;color:var(--accent);padding:0 8px}
  .emerge h2{
    font-family:var(--display);font-weight:400;margin:0;
    font-size:clamp(26px,3.4vw,44px);line-height:1.04;letter-spacing:-.02em;text-wrap:balance;
  }
  .emerge .said{
    font-family:var(--display);font-size:clamp(15px,1.45vw,20px);line-height:1.5;
    color:var(--ink-2);margin:14px 0 0;max-width:46ch;
  }
  .emerge .why{margin:16px 0 0;min-height:44px;border-top:1px solid var(--line);padding-top:12px}
  .emerge .why .rel{
    font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--accent);display:block;margin-bottom:6px;
  }
  .emerge .why p{margin:0;font-family:var(--display);font-style:italic;font-size:15px;line-height:1.45;color:var(--ink);max-width:48ch}
  .emerge .why .idle{font-style:normal;font-family:var(--body);font-size:12.5px;color:var(--ink-3)}

  .lives{margin:14px 0 0;border-top:1px solid var(--line);padding-top:12px;display:grid;gap:1px}
  .lives button{
    appearance:none;background:none;border:0;padding:5px 0;cursor:pointer;text-align:left;
    display:flex;align-items:baseline;gap:12px;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink);
  }
  .lives button:hover{color:var(--accent)}
  .lives button em{
    font-style:normal;margin-left:auto;text-transform:none;letter-spacing:0;
    font-family:var(--body);font-size:11.5px;color:var(--ink-3);text-align:right;
  }
  .lives button:hover em{color:var(--ink-2)}
  .lives.empty p{margin:0;font-size:13.5px;line-height:1.6;color:var(--ink-3);max-width:46ch}
  .srcline{margin:11px 0 0;font-size:9.5px;letter-spacing:.14em;color:var(--ink-3)}

  /* a border you can see before you cross it */
  .cross{margin:15px 0 0;border-top:1px solid var(--accent-soft);padding-top:11px}
  .cross .lbl{
    display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--accent);margin-bottom:8px;
  }
  .cross button{
    appearance:none;background:none;border:0;padding:4px 0;cursor:pointer;text-align:left;display:block;
    font-family:var(--display);font-size:15px;line-height:1.35;color:var(--ink);
  }
  .cross button:hover{color:var(--accent)}
  .cross button b{
    display:block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--ink-2);font-weight:400;margin-top:2px;
  }
  .cross button:hover b{color:var(--accent)}

  .acts{display:flex;flex-wrap:wrap;gap:0 22px;margin-top:18px}
  .acts button{
    appearance:none;background:none;border:0;padding:6px 0;cursor:pointer;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-2);border-bottom:1px solid transparent;
  }
  .acts button:hover{color:var(--accent);border-bottom-color:var(--accent-soft)}

  .whisper{
    position:absolute;z-index:4;left:var(--gut);bottom:var(--space-6);
    font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);
    opacity:0;transition:opacity var(--dur-slow) ease;pointer-events:none;
  }
  .whisper.on{opacity:1}

  /* ── group headings and the writing list in a region ── */
  .grouphd{
    margin:20px 0 9px;padding-bottom:7px;border-bottom:1px solid var(--line);
    font-size:10px;letter-spacing:.2em;color:var(--ink-3);
  }
  .grouphd b{color:var(--accent);font-weight:400;margin-left:6px}
  .reads{display:grid;gap:1px}
  .reads button{
    appearance:none;background:none;border:0;padding:8px 0;cursor:pointer;text-align:left;
    display:grid;grid-template-columns:74px minmax(0,1fr);gap:12px;align-items:baseline;width:100%;
    border-bottom:1px solid var(--line);
  }
  .reads button:last-child{border-bottom:0}
  .reads .k{
    font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);
  }
  .reads .ttl{font-family:var(--display);font-size:16px;line-height:1.25;color:var(--ink)}
  .reads button:hover .ttl{color:var(--accent)}
  .reads button:hover .k{color:var(--accent)}

  /* ══════════════════════════════════════════════════════════════
     THE READING PAGE — a document, not a room

     A region is a place you stand in: enormous display type, weather,
     things drifting. A writing is a FILE you take off a shelf: ruled
     margins, a running head, numbered sections, a folio at the foot.
     Two different kinds of object, so two different kinds of page.
     Nothing here is set the way a MIG is set — different face,
     different size, different rhythm — so the two can never be
     mistaken for each other.

     One rule holds the whole page together, and it is an honesty
     rule as much as a typographic one:

        --doc-serif   source material — a line that traces to one of
                      his documents, named directly beneath it.
        --body        the file's own voice — headings, notes, the
                      reasons two things sit next to each other.

     Nothing the file wrote is allowed to be set like something he wrote.
     ══════════════════════════════════════════════════════════════ */
  :root{
    /* a text face, not the display face the regions shout in.
       Georgia against Palatino: sturdier, larger x-height, made to be
       read at size rather than admired at scale. Still no webfont. */
    --doc-serif:Georgia,'Iowan Old Style','Times New Roman',Times,serif;
    --doc-h:46px;
  }
  .reader{
    position:absolute;inset:0;z-index:9;
    /* the surround recedes and the sheet comes forward — in a dark room and
       in a lit one, the page is always the lighter of the two */
    background:color-mix(in srgb, var(--black) 7%, var(--env));
    /* the sheet is centred in this box, so nothing inside it may ever widen
       the box — one overflowing running head would push the whole page off
       centre and crop the text on a phone */
    overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
    opacity:0;pointer-events:none;transition:opacity var(--dur-panel) ease;
    scrollbar-width:thin;scrollbar-color:var(--line) transparent;
  }
  .reader.on{opacity:1;pointer-events:auto}
  .reader::-webkit-scrollbar{width:4px}
  .reader::-webkit-scrollbar-thumb{background:var(--line)}
  .reader::-webkit-scrollbar-track{background:transparent}
  .rclose{
    position:fixed;z-index:11;top:clamp(11px,1.6vh,15px);left:clamp(14px,2vw,26px);
    appearance:none;background:none;border:0;padding:6px 10px 6px 6px;cursor:pointer;
    font-family:var(--display);font-size:22px;line-height:1;color:var(--ink-3);
    transition:color var(--dur-quick) ease,transform var(--dur-quick) ease;
  }
  .rclose:hover{color:var(--ink);transform:translateX(-3px)}

  /* ── the sheet ───────────────────────────────────────────────── */
  .rinner{min-height:100%}
  .doc{
    max-width:824px;margin:0 auto;min-height:100vh;
    padding:0 clamp(20px,4.4vw,66px) clamp(26px,4.5vh,48px);
    background:color-mix(in srgb, var(--white) 3%, var(--env));
    border-left:1px solid var(--line);border-right:1px solid var(--line);
  }

  /* ── the running head, and how far through the file you are ──── */
  .dochead{
    position:sticky;top:0;z-index:3;height:var(--doc-h);
    margin:0 clamp(-66px,-4.4vw,-20px);padding:0 clamp(20px,4.4vw,66px);
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;
    font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--ink-3);background:color-mix(in srgb, var(--white) 3%, var(--env));
    border-bottom:1px solid transparent;transition:border-color var(--dur-snap) ease;
  }
  .reader.scrolled .dochead{border-bottom-color:var(--line)}
  .dochead span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dochead .dh-c{color:var(--accent);letter-spacing:.26em}
  .dochead .dh-r{text-align:right}
  .docprog{
    position:absolute;left:0;bottom:-1px;height:1px;width:var(--prog,0%);
    background:var(--accent);transition:width var(--dur-instant) linear;
  }

  /* ── the title page: the writing, alone, in the middle ───────── */
  .docplate{
    min-height:calc(100vh - var(--doc-h));min-height:calc(100svh - var(--doc-h));
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;position:relative;padding:clamp(26px,6vh,64px) 0 clamp(58px,9vh,92px);
  }
  .pkind{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.34em;text-transform:uppercase;
    color:var(--accent);margin:0 0 clamp(20px,3.6vh,36px);
  }
  .ptitle{
    font-family:var(--mono);font-size:clamp(11px,1.25vw,14px);letter-spacing:.24em;
    text-transform:uppercase;color:var(--ink-2);margin:0 0 clamp(16px,2.6vh,26px);
    max-width:46ch;line-height:1.8;
  }
  .pline{
    font-family:var(--doc-serif);font-weight:400;
    font-size:clamp(22px,2.9vw,38px);line-height:1.32;letter-spacing:0;
    color:var(--ink);margin:0;max-width:21ch;text-wrap:balance;
  }
  .docplate.long .pline{
    font-size:clamp(17px,1.72vw,23px);line-height:1.62;max-width:52ch;text-align:left;
  }
  .prule{width:58px;height:1px;background:var(--line);margin:clamp(26px,4.4vh,46px) 0 0}
  .pattr{
    font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--ink-3);margin:15px 0 0;line-height:2.1;max-width:64ch;
  }
  .pattr b{color:var(--ink-2);font-weight:400}
  .pattr .warn{color:var(--accent)}
  .pcue{
    position:absolute;left:50%;transform:translateX(-50%);bottom:clamp(10px,2vh,22px);
    display:flex;flex-direction:column;align-items:center;gap:9px;
    font-family:var(--mono);font-size:8.5px;letter-spacing:.26em;text-transform:uppercase;
    color:var(--ink-3);transition:opacity var(--dur-panel) ease;
  }
  .pcue i{display:block;width:1px;height:26px;background:var(--line)}
  .reader.scrolled .pcue{opacity:0}

  /* ── the body of the document: numbered sections in a margin ─── */
  .docbody{border-top:1px solid var(--line);padding-top:clamp(30px,5.5vh,60px)}
  .sec{
    display:grid;grid-template-columns:clamp(36px,4.6vw,62px) minmax(0,1fr);
    gap:0 clamp(12px,1.8vw,24px);padding:0 0 clamp(30px,5.4vh,58px);
  }
  .sec .num{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--accent);padding-top:2px}
  .sec h2{
    margin:0 0 clamp(14px,2.2vh,22px);font-family:var(--mono);font-weight:400;
    font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-2);
  }

  /* the file's own voice: sans, always */
  .note{font-family:var(--body);font-size:15px;line-height:1.74;color:var(--ink-2);max-width:60ch;margin:0}
  .note+.note{margin-top:.95em}
  .note b{color:var(--ink);font-weight:500}
  .note .warn{color:var(--accent)}

  /* his voice: serif, always — and never at region scale */
  .full{font-family:var(--doc-serif);font-size:clamp(16px,1.3vw,18px);line-height:1.78;color:var(--ink);max-width:62ch;margin:0}
  .full p{margin:0 0 1.15em}
  .full p:last-child{margin:0}

  /* the catalogue record — what the file knows about this line */
  .record{
    margin:clamp(22px,3.4vh,34px) 0 0;display:grid;grid-template-columns:auto minmax(0,1fr);
    max-width:50ch;border-top:1px solid var(--line);
  }
  .record dt{

  /* a contradiction: two things set side by side and left there */
  .poles{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);max-width:64ch}

  .filed{font-family:var(--body);font-size:14px;line-height:1.62;color:var(--ink-2)}
  .polenote{
    font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--ink-3);margin:12px 0 0;
  }

  /* the connections, set as numbered notes on the text */
  .lnk{
    appearance:none;background:none;border:0;border-top:1px solid var(--line);
    padding:15px 0;cursor:pointer;text-align:left;width:100%;
    display:grid;grid-template-columns:clamp(24px,2.8vw,36px) minmax(0,1fr);gap:0 10px;
  }
  .lnk:last-of-type{border-bottom:1px solid var(--line)}
  .lnk .n{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--ink-3);padding-top:5px}
  .lnk .rel{
    display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.17em;
    text-transform:uppercase;color:var(--accent);margin-bottom:7px;line-height:1.9;
  }
  .lnk .rel .self{color:var(--ink-3)}
  .lnk .to{display:block;font-family:var(--body);font-size:16px;line-height:1.35;color:var(--ink)}
  .lnk .why{display:block;font-family:var(--body);font-size:14px;line-height:1.65;color:var(--ink-2);margin-top:6px;max-width:56ch}
  .lnk:hover .to,.lnk:hover .n{color:var(--accent)}

  /* where the file lets you out */
  .xgo{
    appearance:none;background:none;border:0;border-top:1px solid var(--line);
    padding:13px 0;cursor:pointer;text-align:left;width:100%;
    display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;max-width:50ch;

  .xgo em{
    font-style:normal;margin-left:auto;font-family:var(--body);font-size:12.5px;
    letter-spacing:0;text-transform:none;color:var(--ink-3);
  }
  .xgo:hover{color:var(--accent)}
  .xgo:hover em{color:var(--ink-2)}

  /* ── the foot of the page ─────────────────────────────────────── */
  .docfoot{
    border-top:1px solid var(--line);padding-top:clamp(18px,3vh,28px);
    display:flex;flex-wrap:wrap;gap:10px 24px;align-items:baseline;justify-content:space-between;
    font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);

  .docfoot .folio{color:var(--ink-2)}
  .colophon{
    flex:1 1 100%;margin:16px 0 0;font-family:var(--body);font-size:11.5px;line-height:1.7;
    letter-spacing:0;text-transform:none;color:var(--ink-3);max-width:66ch;

  @media (max-width:1080px){ .dochead{padding-left:46px} }
  @media (max-width:900px){
    .doc{border-left:0;border-right:0}
    .sec{grid-template-columns:1fr}
    .sec .num{padding:0 0 9px}

    .docplate.long .pline{max-width:none}
    .dochead{font-size:8px;letter-spacing:.14em}

  /* on a phone the running head keeps the two things you need to stay
     oriented — which region, and which file — and drops the byline */
  @media (max-width:560px){
    .dochead{grid-template-columns:1fr auto;padding-left:40px}
    .dochead .dh-l{display:none}
  }

  /* ══════════════════════════════════════════════════════════════
     THE WORLDS
     The neurons never change. Everything around them does — the
     ground they stand on, where the name sits, how dense the air is.
     ══════════════════════════════════════════════════════════════ */
  .migtitle{
    position:absolute;z-index:3;pointer-events:none;margin:0;
    color:var(--ink);opacity:0;transition:opacity var(--dur-world) ease;

  .migtitle small{
    display:block;font-family:var(--mono);font-weight:400;font-size:10px;
    letter-spacing:.3em;text-transform:uppercase;color:var(--ink-3);margin-bottom:14px;
  }

  /* PHILOSOPHY · dense editorial. Too many thoughts at once. */
  html.w-philosophy .migtitle{font-size:clamp(46px,9.5vw,148px);top:clamp(44px,7vh,78px);max-width:9ch}
  html.w-philosophy .emerge{width:min(430px,calc(100% - var(--gut)*2))}

  /* HUMAN BEHAVIOUR · translucent layers, everything influencing everything */
  html.w-behaviour .migtitle{left:auto;right:var(--gut);text-align:right;top:clamp(50px,8vh,92px);font-size:clamp(34px,5.6vw,84px);max-width:12ch}

  /* BUSINESS · white architecture. Strategy made visible. */
  html.w-business .migtitle{font-family:var(--body);font-weight:600;letter-spacing:-.03em;font-size:clamp(34px,5.4vw,78px);top:clamp(50px,8vh,88px)}
  html.w-business .emerge{border-left-width:2px}
  html.w-business .emerge h2{font-family:var(--body);font-weight:600;letter-spacing:-.025em}
  html.w-business .emerge .said{font-family:var(--body);font-size:15px;line-height:1.6}
  html.w-business .emerge .why p{font-family:var(--body);font-style:normal;font-size:14px}

  /* TECHNOLOGY · computational modularism */
  html.w-technology .migtitle{font-family:var(--mono);font-size:clamp(22px,3.2vw,44px);letter-spacing:.16em;left:auto;right:var(--gut);top:clamp(46px,7vh,82px);text-align:right}
  html.w-technology .emerge h2{font-family:var(--mono);font-size:clamp(18px,2.1vw,27px);letter-spacing:.02em}

  /* BUILDING · blueprint, mid-construction */
  html.w-building .migtitle{font-family:var(--mono);font-size:clamp(20px,2.9vw,40px);letter-spacing:.2em;top:clamp(46px,7vh,82px)}

  /* LEARNING · a mental model being built */
  html.w-learning .migtitle{left:50%;transform:translateX(-50%);text-align:center;top:clamp(44px,6.5vh,74px);font-size:clamp(32px,5vw,72px)}

  /* OBSERVATION · paper, annotated */
  html.w-observation .migtitle{font-style:italic;font-size:clamp(32px,5vw,72px);left:auto;right:var(--gut);top:clamp(48px,7.5vh,86px);text-align:right}
  html.w-observation .emerge{left:auto;right:var(--gut);border-left:0;border-right:1px solid var(--accent);padding-left:0;padding-right:18px;text-align:right}
  html.w-observation .lives button,html.w-observation .cross button{flex-direction:row-reverse;text-align:right}
  html.w-observation .lives button em{margin-left:0;margin-right:auto;text-align:left}
  html.w-observation .acts{justify-content:flex-end}

  /* LIFE · expansive, temporal */
  html.w-life .migtitle{left:50%;transform:translateX(-50%);text-align:center;top:clamp(76px,19vh,210px);font-size:clamp(44px,9vw,140px)}
  html.w-life .migtitle.on{opacity:.9}

  /* MUSIC · rhythm, not interface */
  html.w-music .migtitle{left:50%;transform:translateX(-50%);text-align:center;top:auto;bottom:clamp(22px,4vh,44px);font-family:var(--mono);font-size:11px;letter-spacing:.62em}
  html.w-music .migtitle small{display:none}
  html.w-music .emerge{width:min(420px,calc(100% - var(--gut)*2))}

  /* MOVIES · framed, sequential */
  html.w-movies .migtitle{left:50%;transform:translateX(-50%);text-align:center;top:clamp(62px,10vh,108px);font-size:clamp(28px,4.4vw,62px);letter-spacing:.06em}

  /* FOOD · tactile, close */
  html.w-food .migtitle{top:clamp(48px,7.5vh,88px);font-size:clamp(36px,6vw,88px)}

  /* LOVE · proximity, and the distance across it */
  html.w-love .migtitle{left:50%;transform:translateX(-50%);text-align:center;top:clamp(52px,8vh,96px);font-size:clamp(20px,2.6vw,34px);letter-spacing:.42em}

  /* SOCIETY · an assembly. Institutional type, a floor everyone stands on. */
  html.w-society .migtitle{
    font-size:clamp(26px,4.2vw,58px);letter-spacing:.06em;
    left:50%;transform:translateX(-50%);text-align:center;top:clamp(46px,7vh,84px);
  }
  html.w-society .emerge{width:min(520px,calc(100% - var(--gut)*2))}

  /* MY WORKS · a working archive. Ledger type, shelf rules, build numbers. */
  html.w-my-works .migtitle{
    font-family:var(--mono);font-size:clamp(18px,2.5vw,34px);letter-spacing:.26em;
    top:clamp(46px,7vh,80px);
  }
  html.w-my-works .migtitle small{letter-spacing:.34em}
  html.w-my-works .emerge h2{font-family:var(--mono);font-size:clamp(17px,2vw,25px);letter-spacing:.03em}
  html.w-my-works .lives button{border-bottom:1px solid var(--line);padding:7px 0}
  html.w-my-works .emerge .said{font-family:var(--body);font-size:14.5px}

  /* ── the page is composed differently per world ──
     Not just the decoration: where the reading happens moves too. */

  /* MY WORKS · a ledger down the right-hand side */
  html.w-my-works .emerge{
    left:auto;right:var(--gut);border-left:0;border-right:1px solid var(--accent);
    padding-left:0;padding-right:18px;text-align:right;width:min(430px,calc(100% - var(--gut)*2));
  }
  html.w-my-works .lives button,html.w-my-works .cross button{flex-direction:row-reverse;text-align:right}
  html.w-my-works .lives button em{margin-left:0;margin-right:auto;text-align:left}
  html.w-my-works .acts{justify-content:flex-end}

  /* MUSIC · a small block held in the middle of an empty field */
  html.w-music .emerge{
    left:50%;transform:translateX(-50%) translateY(14px);bottom:clamp(54px,10vh,98px);
    width:min(360px,calc(100% - var(--gut)*2));text-align:center;
    border-left:0;border-top:1px solid var(--accent);padding-left:0;padding-top:16px;
  }
  html.w-music .emerge.on{transform:translateX(-50%)}
  html.w-music .lives button,html.w-music .acts{justify-content:center}
  html.w-music .lives button em{display:none}

  /* MOVIES · a caption band across the lower frame */
  html.w-movies .emerge{
    width:min(760px,calc(100% - var(--gut)*2));bottom:clamp(38px,7vh,70px);
    border-left:0;border-top:1px solid var(--accent);padding-left:0;padding-top:15px;
  }
  html.w-movies .lives{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}

  /* LIFE · pushed to the floor of a vast field */
  html.w-life .emerge{bottom:clamp(18px,3.2vh,38px);width:min(470px,calc(100% - var(--gut)*2))}

  /* PHILOSOPHY · a narrow column, like the sidebar of an essay */
  html.w-philosophy .emerge{bottom:clamp(18px,3.6vh,42px)}

  @media (max-width:860px){
    .emerge{width:calc(100% - var(--gut)*2) !important}
    .migtitle{font-size:clamp(28px,8.5vw,52px) !important;max-width:none !important;left:var(--gut) !important;right:auto !important;transform:none !important;text-align:left !important}
    html.w-music .migtitle{font-size:11px !important;left:50% !important;transform:translateX(-50%) !important;text-align:center !important}
    html.w-observation .emerge,html.w-my-works .emerge,html.w-music .emerge,html.w-movies .emerge{
      left:var(--gut);right:auto;transform:none;text-align:left;
      border-right:0;border-top:0;border-left:1px solid var(--accent);
      padding-right:0;padding-left:18px;padding-top:0;
    }
    html.w-music .emerge.on{transform:none}
    html.w-observation .lives button,html.w-observation .cross button,
    html.w-my-works .lives button,html.w-my-works .cross button{flex-direction:row;text-align:left}
    html.w-observation .acts,html.w-my-works .acts,html.w-music .acts,html.w-music .lives button{justify-content:flex-start}
    html.w-movies .lives{grid-template-columns:1fr}
  }
  /* ══════════════════════════════════════════════════════════════
     THE PHONE

     A 14-region ellipse shrunk to 375px is an unreadable picture of a
     map, so the phone does not get a smaller desktop. It gets a
     different spatial model of the SAME state.

     P1 already built the graph as structure — a focusable list of the
     current view, ordered "where you are, what it connects to, the ways
     out". On desktop that layer is a screen-reader representation. On a
     phone it is promoted to being the interface itself, and the canvas
     above it keeps painting the environment.

     One graph state. Two spatial representations. No second data model,
     no separate mobile information architecture, and the keyboard model
     from P1 keeps working because it is literally the same elements.
     ══════════════════════════════════════════════════════════════ */
  @media (max-width:560px){
    /* the canvas keeps the climate; the sheet carries the structure */
    :root{--sheet:58vh; --sheet:58svh}

    .a11y#graphnav{
      position:absolute;z-index:5;left:0;right:0;bottom:0;height:var(--sheet);
      width:auto;margin:0;clip:auto;clip-path:none;overflow-y:auto;overscroll-behavior:contain;
      white-space:normal;
      background:color-mix(in srgb, var(--white) 4%, var(--env));
      border-top:1px solid var(--line);
      padding:0 0 var(--space-6);
      -webkit-overflow-scrolling:touch;
    }
    /* light-ground regions need the sheet to sit the other way round */
    html.w-business #graphnav,html.w-learning #graphnav,html.w-observation #graphnav{
      background:color-mix(in srgb, var(--black) 4%, var(--env));
    }
    #graphnav button{
      appearance:none;background:none;border:0;border-bottom:1px solid var(--line);
      width:100%;min-height:52px;padding:11px var(--gut) 12px;margin:0;cursor:pointer;
      display:grid;grid-template-columns:26px minmax(0,1fr);gap:0 12px;align-items:start;
      text-align:left;color:var(--ink);font-family:var(--body);
    }
    #graphnav button:last-child{border-bottom:0}
    #graphnav button:active{background:color-mix(in srgb, var(--accent) 12%, transparent)}
    /* explicit placement: with auto-placement the gloss fell into the glyph
       column and rendered clipped down the left edge */
    .nv-g{display:block;grid-column:1;grid-row:1/-1;padding-top:2px;color:var(--ink-2)}
    .nv-l,.nv-m,.nv-v,.nv-w{grid-column:2}
    .nv-l{
      display:block;font-family:var(--display);font-size:17px;line-height:1.25;
      color:var(--ink);text-wrap:balance;
    }
    .nv-m{
      display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;
      text-transform:uppercase;color:var(--ink-3);margin-top:5px;
    }
    /* the relationship, readable at arm's length: the two ends recede and the
       verb — the part that carries the claim — is the thing you see */
    .nv-v{
      display:block;font-family:var(--mono);font-size:9.5px;line-height:1.55;
      letter-spacing:.01em;color:var(--ink-3);margin-top:6px;
    }
    .nv-v b{
      color:var(--accent);font-weight:400;text-transform:uppercase;
      letter-spacing:.13em;font-size:8.5px;
    }
    .nv-w{
      display:block;font-family:var(--body);font-size:13px;line-height:1.5;
      color:var(--ink-2);margin-top:5px;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    }
    /* "you are here" is the heading of the sheet, not another row */
    #graphnav button[data-here]{
      position:sticky;top:0;z-index:2;border-bottom:1px solid var(--accent-soft);
      background:color-mix(in srgb, var(--white) 7%, var(--env));
    }
    #graphnav button[data-here] .nv-l{font-size:21px}
    #graphnav button[data-here] .nv-m{color:var(--accent)}

    /* the two navigation promises stay separate and stay small, but each
       gets a real 44px target underneath it */
    .back,.mindbtn{padding:12px 14px;min-width:44px;min-height:44px}
    .back{font-size:24px;line-height:1}
    .mindbtn::after{display:none}          /* a tooltip is meaningless on touch */

    /* the desktop reading panel is replaced by the sheet */
    .emerge{display:none}
    .whisper{bottom:calc(var(--sheet) + 14px);font-size:9px}
    .migtitle{
      font-size:clamp(23px,7.5vw,34px) !important;top:56px !important;
      left:var(--gut) !important;right:auto !important;transform:none !important;
      text-align:left !important;max-width:none !important;
    }
    html.w-music .migtitle{font-size:10px !important;letter-spacing:.4em !important}

    /* the document, at arm's length */
    .doc{padding-left:var(--gut);padding-right:var(--gut)}
    .rinner{font-size:16px}
    .pline{font-size:clamp(21px,6.2vw,26px);line-height:1.34;max-width:none}
    .docplate.long .pline{font-size:17px;line-height:1.6}
    .note{font-size:15.5px;line-height:1.7}
    .full{font-size:17px;line-height:1.72}
    .lnk{padding:16px 0}
    .lnk .to{font-size:17px}
    .rclose{padding:12px 14px;min-width:44px;min-height:44px}
    /* every control in the document is a fingertip target too */
    .reader button{min-height:44px}
    .xgo{padding:15px 0}
  }
  /* a phone in landscape has no room for a 58vh sheet */
  @media (max-width:900px) and (max-height:520px){
    :root{--sheet:64vh}
    .migtitle{display:none}
  }

  @media (prefers-reduced-motion:reduce){ *{animation-duration:.001ms !important;transition-duration:.001ms !important} }
</style>

<div class="stage" id="stage">

      <path d="M12 4.4c1.5-1.4 4.2-1.2 5.3.5 1.9-.2 3.2 1.3 2.9 3 1.3.9 1.4 2.9.1 3.9.5 1.8-.9 3.4-2.7 3.3-.4 1.7-2.4 2.6-3.9 1.7-.6.9-1.7 1.2-1.7 1.2"/>
      <path d="M12 4.4V19.6"/>
      <path d="M9.1 8.2c.9.3 1.6 1 1.9 1.9M14.9 8.2c-.9.3-1.6 1-1.9 1.9M8.6 13c.9-.2 1.8 0 2.4.6M15.4 13c-.9-.2-1.8 0-2.4.6"/>
    </svg>
  </button>

  <h1 class="migtitle" id="migTitle"></h1>

  <div class="threshold" id="threshold">
    <div class="eyebrow mono">A personal knowledge system</div>
    <h1 class="name">Siddhesh<em>Thapa</em></h1>
    <p class="subline">A record of what I think, what I build, what I believe, and <b>what I eventually realize I was wrong about.</b></p>
    <button class="enter" id="enterBtn"><span class="rule"></span>Enter the mind →</button>

<script>
(function(){
  var stage=document.getElementById('stage'),
      cv=document.getElementById('graph'), ctx=cv.getContext('2d'),
      threshold=document.getElementById('threshold'),
      enterBtn=document.getElementById('enterBtn'),
      backBtn=document.getElementById('backBtn'),
      emerge=document.getElementById('emerge'),
      whisper=document.getElementById('whisper'),
      fragEl=document.getElementById('frag');

  var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Ink and accent belong to the world you are standing in; they ease
  // between worlds so a crossing is a change of light, not a repaint.
  var envRGB=[6,8,12], inkRGB=[238,241,245], accRGB=[76,141,255];
  function rgbStr(c){return c[0]+','+c[1]+','+c[2];}
  function INK(a){return 'rgba('+rgbStr(inkRGB)+','+a+')';}
  function ACC(a){return 'rgba('+rgbStr(accRGB)+','+a+')';}
  function GROUND(a){return 'rgba('+rgbStr(envRGB)+','+a+')';}

         piled onto each other on a 2560 screen. One column, shared edge, their
         original vertical spacing preserved. */
      var blocked=list.filter(function(n){
        var b=labelBox(n);
        return !(b.x1<p.x0||b.x0>p.x1||b.y1<p.y0||b.y0>p.y1);
      });
      if(blocked.length){
        var maxHalf=Math.max.apply(null,blocked.map(function(n){return labelBox(n).half;}));
        var rightX=p.x1+maxHalf+10, leftX=p.x0-maxHalf-10;
        var useRight=(rightX+maxHalf<=W-10);
        var colX=useRight?rightX:leftX;
        blocked.forEach(function(n){
          if(colX-labelBox(n).half>=10 && colX+labelBox(n).half<=W-10){ n.tx=colX; return; }
          var above=p.y0-40;                       // no room either side: go above
          if(above>28) n.ty=above;
        });
      }
    }

    /* Separate labels from each other, vertically. A move is only taken if it
       is on stage AND does not walk back onto the panel — the first version of
       this pass skipped the panel test and turned 0 overlaps into 19. */
    function boxAt(n,y){
      var half=labelBox(n).half;
      return {x0:n.tx-half,y0:y-12,x1:n.tx+half,y1:y+34};
    }
    function free(n,y){
      if(y<28||y>H-18)return false;
      if(!p)return true;
      var b=boxAt(n,y);
      return b.x1<p.x0||b.x0>p.x1||b.y1<p.y0||b.y0>p.y1;
    }
    for(var pass=0;pass<5;pass++){
      var moved=false;
      for(var i=0;i<all.length;i++) for(var j=i+1;j<all.length;j++){
        var a=labelBox(all[i]), c=labelBox(all[j]);
        if(a.x1<c.x0||a.x0>c.x1||a.y1<c.y0||a.y0>c.y1)continue;
        var push=Math.min(a.y1-c.y0,c.y1-a.y0)/2+7;
        var up=all[i].ty<=all[j].ty?all[i]:all[j];
        var dn=up===all[i]?all[j]:all[i];
        if(free(up,up.ty-push)){ up.ty-=push; moved=true; }
        if(free(dn,dn.ty+push)){ dn.ty+=push; moved=true; }
      }
      if(!moved)break;
    }
  }

  var ring1={},ring2={},rim={},poleIds={};
  function retarget(){
    ring1={};ring2={};rim={};poleIds={};
    var m=mode(), c=cfg();
    if(m==='world'){
      NODES.forEach(function(n){var a=home(n);n.tx=a.x;n.ty=a.y;});
      refreshMotif(); return;
    }
    // the ring begins below whatever this world placed at the top —
    // measured, because every world sets its title differently
    var topPad=Math.min(56,H*.08);
    if(phone()){
      /* On a phone the canvas is only the band above the sheet. The
         constellation is what you see; the structure is what you read
         underneath it. Fewer nodes, further apart, and the borders stay
         out of the way because the sheet already lists where you can go. */
      // clear the region title, which sits at the top of the band on a phone
      var pTop=Math.max(topPad,118);
      var band=sheetTop()-12;
      var pCx=W*.5, pCy=pTop+(band-pTop)*.52;
      var pr=Math.min(W*.34, (band-pTop)*.44);
      focus.tx=pCx; focus.ty=pCy;
      if(m==='mig') minorsOf(focus.id).forEach(function(id){ ring1[id]=1; });
      else adj[focus.id].forEach(function(k){ if(byId[k.o].mig===focus.mig) ring1[k.o]=1; });
      /* The canvas can hold about six marks at this width. That is a DRAWING
         limit, not a data limit — deleting the overflow from ring1 also
         deleted it from the sheet, and philosophy quietly lost its seventh
         concept. The sheet lists everything; the constellation shows the
         first few. */
      var ids=Object.keys(ring1).slice(0,6);
      ids.forEach(function(id,k){
        // half-step offset: with two neighbours a plain distribution puts both
        // on the vertical axis and the "constellation" is a straight line
        var a=-Math.PI/2+((k+.5)/Math.max(1,ids.length))*6.2832;
        byId[id].tx=pCx+Math.cos(a)*pr; byId[id].ty=pCy+Math.sin(a)*pr*.92;
      });
      /* The ways out still belong in the DATA — the sheet lists them under
         "Leads to", which is how you leave a region on a phone. They are
         simply not drawn on the canvas. */
      if(m==='mig') MIGS.forEach(function(M){ if(M!==focus) rim[M.id]=1; });
      else { rim[focus.mig]=1; (focus.crosses||[]).forEach(function(mid){ rim[mid]=1; }); }
      /* No rim on the canvas. Thirteen identical region marks in a row at
         375px is a line of noise that collides with the brain control, and
         the sheet already lists every way out by name under "Leads to".
         The constellation shows what you are standing on and what it
         touches — nothing else. */
      NODES.forEach(function(n){
        if(n===focus||ids.indexOf(n.id)>=0)return;
        n.tx=W*.5; n.ty=-H*.4;                        // parked off the band
      });
      // the phone gets no desktop grid — P3's model is authoritative, and
      // panelBox() is null here because .emerge is display:none at ≤560px
      comp={Cx:pCx, Cy:pCy, r:pr, phone:true};
      refreshMotif(); return;
    }
    if(migTitle&&migTitle.classList.contains('on')){
      var tr=migTitle.getBoundingClientRect(), sr=stage.getBoundingClientRect();
      var tb=tr.bottom-sr.top;
      if(tr.height&&tb<H*.55) topPad=Math.max(topPad,tb+26);
    }
    var floor=(emergeTop?emergeTop:H*.72)-26;
    // Where the world puts its centre of attention. Philosophy sits off to
    // the right of an asymmetric field; Music sits far left with the space
    // to its right doing the work; Life sits high and distant.
    var an=c.anchor||[.5,.5];
    var band=floor-topPad;
    var Cx=Math.max(W*.16,Math.min(W*.84, W*an[0]));
    var Cy=Math.max(topPad+70, Math.min(floor-70, topPad+band*an[1]));
    var span=Math.max(120,Math.min(Cy-topPad, floor-Cy));
    // the inner ring and the rim need real air between them, or the
    // minor IGs collide with the MIG labels waiting at the border
    var dn=c.dens||1;
    var rx1=Math.min(W*.24*dn,330*dn), ry1=Math.min(span*.56*c.gapY*dn,190*dn);
    // an off-centre world has less room on one side — the ring has to fit
    // the space it was actually given, not the space it would have had
    rx1=Math.max(150,Math.min(rx1, Cx-104, W-Cx-104));
    var rxR=Math.min(W*.44,620,Math.max(220,W/2-104)), ryR=Math.min(span,300);

    /* The composition retarget() just worked out, published for the painter.
       The editorial grid must sit around the ACTUAL graph, not around a second
       coordinate system invented in paintMotif() — so the numbers are exported
       rather than recomputed. Set before refreshMotif() runs at the end. */
    comp={Cx:Cx, Cy:Cy, rx1:rx1, ry1:ry1, rxR:rxR, ryR:ryR,
          topPad:topPad, floor:floor, phone:false};

    focus.tx=Cx; focus.ty=Cy;

    if(m==='mig'){
      // A MIG shows its OWN minor IGs. Nothing borrowed from elsewhere.
      minorsOf(focus.id).forEach(function(id){ ring1[id]=1; });
      MIGS.forEach(function(M){ if(M!==focus) rim[M.id]=1; });
    }else{
      // Only this region's own material enters the ring. Anything belonging to
      // another MIG is reached through "crosses into", never dropped in here.
      adj[focus.id].forEach(function(k){
        if(byId[k.o].mig===focus.mig) ring1[k.o]=1;
      });
      Object.keys(ring1).forEach(function(id){
        adj[id].forEach(function(k){
          if(k.o!==focus.id&&!ring1[k.o]&&byId[k.o].mig===focus.mig) ring2[k.o]=1;
        });
      });
      var hostMig=focus.mig;
      rim[hostMig]=1; delete ring1[hostMig]; delete ring2[hostMig];
      (focus.crosses||[]).forEach(function(mid){ rim[mid]=1; delete ring2[mid]; });
    }

    arrange(m==='mig'?c.ring:'wide', Object.keys(ring1).map(function(id){return byId[id];}), Cx,Cy,rx1,ry1);
    /* A focused contradiction is an axis, not a ring. The two poles are placed
       in genuine opposition through the centre — equidistant, mirrored, with
       the contradiction itself held between them. Everything else in the ring
       is pushed off that axis so the tension reads as the composition rather
       than as one more spoke. */
    var poles=(m==='focus')?polesOf(focus):null;
    if(poles && poles[0] && poles[1]){
      /* A steep axis, so the two poles read as opposed rather than as a row —
         and an ANGLE chosen so neither pole lands on the reading panel. The
         first version placed the axis blind and dropped a pole onto the panel
         in four of the six contradictions. Rotating the whole axis keeps the
         two sides mirrored and equal; nudging one pole individually would not. */
      var px=Math.max(rx1*.82,140), py=Math.max(ry1*2.1,150);
      /* The LABEL is what collides, not the dot, so the search reserves its
         real half-width. Rotating (and if need be shortening) the whole axis
         keeps the two sides mirrored and equal — nudging one pole on its own
         would quietly declare a winner. */
      var pb=panelBox(), ang=null, ux, uy;
      var halfA=Math.min(118,(String(poles[0].label).length*6.1)/2+12);
      var halfB=Math.min(118,(String(poles[1].label).length*6.1)/2+12);
      var maxHalf=Math.max(halfA,halfB)+14;
      function poleClear(x,y){
        if(x-maxHalf<W*.03||x+maxHalf>W*.97||y<topPad+26||y>H-52)return false;
        if(!pb)return true;
        return !(x+maxHalf>pb.x0-10 && x-maxHalf<pb.x1+10 && y+38>pb.y0-10 && y-16<pb.y1+10);
      }
      var cands=[-0.95,-1.25,-0.65,-2.05,-0.35,-2.45,-1.55,-2.85,-0.15,-3.0];
      var scales=[1,.78,.60];
      for(var si=0;si<scales.length && ang===null;si++){
        for(var ci=0;ci<cands.length;ci++){
          var sx=px*scales[si], sy=py*scales[si];
          var tu=Math.cos(cands[ci]), tv=Math.sin(cands[ci]);
          if(poleClear(Cx-tu*sx,Cy-tv*sy) && poleClear(Cx+tu*sx,Cy+tv*sy)){
            ang=cands[ci]; px=sx; py=sy; break;
          }
        }
      }
      /* If no rotation or radius clears the panel, fall back to a vertical
         axis placed in whatever horizontal space the panel leaves. Still
         mirrored, still equal — just a narrower field to be opposed in. */
      var forcedX=null;
      if(ang===null && pb){
        var right=(W*.97-maxHalf)-(pb.x1+10+maxHalf), left=(pb.x0-10-maxHalf)-(W*.03+maxHalf);
        forcedX=(right>=left)? Math.min(W*.97-maxHalf, pb.x1+20+maxHalf)
                             : Math.max(W*.03+maxHalf, pb.x0-20-maxHalf);
        ang=-Math.PI/2;
      }
      var axisFound=(ang!==null); if(!axisFound) ang=-0.95;
      ux=Math.cos(ang); uy=Math.sin(ang);
      /* A contradiction routinely spans regions — c-curiosity holds a
         PHILOSOPHY belief against a LIFE belief. The far pole is not in ring1
         and would be parked off-screen, leaving one side of the tension
         invisible, which misrepresents the idea. Both poles are placed on the
         axis and exempted from parking, then clamped onto the stage so
         neither can leave the field. */
      poleIds={}; poleIds[poles[0].id]=1; poleIds[poles[1].id]=1;
      var axX=(forcedX===null)?Cx:forcedX;
      poles[0].tx=axX-ux*px; poles[0].ty=Cy-uy*py;
      poles[1].tx=axX+ux*px; poles[1].ty=Cy+uy*py;
      // clamp only when no clear axis existed — clamping a good axis pushes
      // poles back onto the panel the search had just avoided
      if(!axisFound) [poles[0],poles[1]].forEach(function(n){
        n.tx=Math.max(W*.12, Math.min(W*.86, n.tx));
        n.ty=Math.max(topPad+26, Math.min(H-52, n.ty));
      });
      Object.keys(ring1).forEach(function(id){
        if(id===poles[0].id||id===poles[1].id)return;
        var n=byId[id], dx=n.tx-Cx, dy=n.ty-Cy;
        // shove the rest perpendicular to the axis so it does not read as a pole
        var perp=(dx*uy-dy*ux)>=0?1:-1;
        n.tx=Cx+(-uy)*perp*px*.86+dx*.18;
        n.ty=Cy+( ux)*perp*py*1.15+dy*.18;
      });
    }
    placeRim(c.rim||'ellipse', Object.keys(rim), Cx,Cy,rxR,ryR, topPad, floor);
    clearPanel(Object.keys(rim), Object.keys(ring1).concat(Object.keys(poleIds)));   // nothing may sit on the panel, and no two labels on each other
    if(m!=='mig') arrange('wide', Object.keys(ring2).filter(function(id){return !rim[id];})
                              .map(function(id){return byId[id];}), Cx,Cy,Math.min(W*.40,520),Math.min(span*.86,262));

    NODES.forEach(function(n){
      if(n===focus||ring1[n.id]||ring2[n.id]||rim[n.id]||poleIds[n.id])return;
      var a=home(n);
      n.tx=a.x+(a.x-Cx)*.16; n.ty=a.y+(a.y-Cy)*.16;
    });
    refreshMotif();
  }

  /* ── the environment layer ──────────────────────────────────────
     Each world is painted once into an offscreen canvas and cross-faded
     when you cross a border. The neurons are drawn on top, unchanged.  */
  var motifCv=null,motifCtx=null,prevCv=null,prevCtx=null,fadeStart=0,lastMotif='',motifT=[];
  function newLayer(){ var c=document.createElement('canvas'); return {c:c,x:c.getContext('2d')}; }

  /* ══════════════════════════════════════════════════════════════
     THE AUTHENTIC FRAGMENT LAYER  (P4)

     A region's atmosphere may quote the region, and nothing else. This
     returns crops of writings that PHILOSOPHY actually owns, and it can
     only return material that carries a source — so the environment is
     incapable of showing a sentence nobody wrote.

     Cropping never rewrites: the text is a prefix of the original, cut at
     a word boundary, closed with an ellipsis so the crop is visible as a
     crop. `mark` is read off the object's own register/state, never
     assigned by taste.
     ══════════════════════════════════════════════════════════════ */
  var MARK={belief:'BELIEF',thought:'WRITING',question:'QUESTION',
            contradiction:'CONTRADICTION',reference:'QUOTE',person:'INFLUENCE',
            project:'PROJECT',experiment:'EXPERIMENT'};
  function cropTo(s,n){
    s=String(s||'').trim();
    if(s.length<=n)return s;
    var cut=s.slice(0,n), sp=cut.lastIndexOf(' ');
    if(sp>n*.55) cut=cut.slice(0,sp);
    return cut.replace(/[,;:.—–\s]+$/,'')+'…';
  }
  /* ATTENTION CHANGES THE LANDSCAPE.

     A fragment's weight is its distance from what you are looking at:
       3  the focused idea's own writing
       2  a writing one relationship away
       1  elsewhere in this region
     With nothing focused every fragment sits at 2 — an even, dense field.
     Select something and the field reorganises around it: what the idea
     touches comes forward, the rest recedes without disappearing, so the
     network is still felt rather than reduced to four nodes.

     Weight comes from the graph, never from word count or taste. */
  var fragCache={};
  function fragWeight(n,f){
    if(!f)return 2;
    if(n.id===f.id)return 3;
    if(adj[f.id].some(function(k){return k.o===n.id;}))return 3;
    if(adj[n.id].some(function(k){return adj[f.id].some(function(q){return q.o===k.o;});}))return 2;
    return 1;
  }
  function fragmentsOf(migId){
    var f=focus, key=migId+'|'+(f?f.id:'-');
    if(fragCache[key])return fragCache[key];
    var list=(owned[migId]||[]).map(function(id){return byId[id];})
      .filter(function(n){ return n.t && n.t!=='minor' && n.src && n.line; })
      .map(function(n){
        var notMine=(n.register==='quote — not mine');
        var open=(n.state==='open'||/unfinished/.test(n.register||''));
        var w=fragWeight(n,f);
        return {
          id:n.id,
          // a fragment the eye is meant to reach is given more of its sentence
          text:cropTo(n.line, w>=3?typeScale(W).crop:(n.line.length>150?86:64)),
          notMine:notMine,
          mark:(open?'UNRESOLVED':(MARK[n.t]||'')),
          src:n.src, w:w
        };
      });
    fragCache[key]=list; return list;
  }
  function philFragments(){ return fragmentsOf('philosophy'); }

  /* ══════════════════════════════════════════════════════════════
     THE EDITORIAL GRID  (P4.4)

     Not a drawn grid. An invisible spatial grammar: the fragments stop
     being scattered by `(i%2 ? W*.50 : W*.045) + ((i*137)%210)` and start
     living in zones derived from the composition the graph is already in.
     What the visitor perceives is alignment — repeated left edges, a shared
     baseline rhythm, consistent margins — not lines.

     Every zone is derived from W, H, the profile tokens and the geometry
     retarget() exported. The reading panel is SUBTRACTED at construction,
     so a fragment can never be placed onto it and then repaired.
     ══════════════════════════════════════════════════════════════ */
  /* The fragment opacity tiers, named so the painter and the acceptance suite
     read the SAME numbers. FRAG_ALPHA[1] is the faintest authentic material on
     screen; the grid must stay under it. */
  var FRAG_ALPHA={3:.155, 2:.062, 2.5:.045, 1:.022};
  var GRID_ALPHA=.018;                  // strictly below FRAG_ALPHA[1]
  /* Marginalia opacity, named for the same reason. These sit ABOVE the
     fragment tiers numerically and are still quieter on screen: a fragment is
     30px display type, a mark is 8.5px mono, and small type needs more opacity
     to be legible at all. The relationship the acceptance suite enforces is
     therefore a bounded ratio, not "marginalia < fragments" — and it reads
     these numbers rather than a copy of them. */
  var MARG_ALPHA={src:{strong:.30, quiet:.14}, cross:{strong:.34, quiet:.15}};
  /* MATERIALITY (P4.7). A surface rather than a canvas: a fine neutral grain,
     generated once into a tile and repeated. It has to stay below perception —
     if the texture is noticed before the ideas it is too strong, and the right
     move then is to remove it. Neutral greys only, so the colour family is
     untouched, and one 128px tile so the cost is a single pattern fill on the
     cached layer, not per frame. */
  var grainTile=null, grainLayer=null, grainKey='';
  function grainFor(w,h){
    var k=w+'x'+h;
    if(grainKey===k && grainLayer) return grainLayer;
    var c=document.createElement('canvas'); c.width=w; c.height=h;
    var x=c.getContext('2d');
    x.fillStyle=x.createPattern(grain(),'repeat'); x.fillRect(0,0,w,h);
    grainKey=k; grainLayer=c; return c;
  }
  function grain(){
    if(grainTile) return grainTile;
    var c=document.createElement('canvas'); c.width=c.height=128;
    var x=c.getContext('2d'), im=x.createImageData(128,128), d=im.data;
    for(var i=0;i<d.length;i+=4){

    x.putImageData(im,0,0); grainTile=c; return c;
  }
  /* THE TYPOGRAPHIC RANGE (P4.7). The old scale ran 30/20/14 — barely two to
     one, which is why the field read as evenly-weighted decoration. A mind does
     not hold every thought at the same volume: one sentence is what you are
     thinking about and the rest are murmuring. The dominant voice scales with
     the viewport; the field voice sits at the edge of legibility on purpose. */
  function typeScale(W){
    var dom=Math.round(Math.min(64, Math.max(34, W*.034)));
    return {dom:dom, crop:(W<1100?58:110),
            mid:Math.max(15, Math.round(dom*.36)),
            small:Math.max(11, Math.round(dom*.235)),
            field:Math.max(10, Math.round(dom*.21))};
  }
  var comp=null;
  function rectArea(r){ return Math.max(0,r.x1-r.x0)*Math.max(0,r.y1-r.y0); }
  /* Remove an obstacle from a zone by keeping the largest remaining
     rectangle. Structural exclusion beats collision repair: nothing is ever
     placed on the panel, so nothing has to be pushed off it. */

    if(!o||o.x1<=z.x0||o.x0>=z.x1||o.y1<=z.y0||o.y0>=z.y1)return z;
    var cands=[
      {x0:z.x0,y0:z.y0,x1:z.x1,y1:Math.min(z.y1,o.y0)},   // above
      {x0:z.x0,y0:Math.max(z.y0,o.y1),x1:z.x1,y1:z.y1},   // below
      {x0:z.x0,y0:z.y0,x1:Math.min(z.x1,o.x0),y1:z.y1},   // left
      {x0:Math.max(z.x0,o.x1),y0:z.y0,x1:z.x1,y1:z.y1}    // right

    cands.forEach(function(c){ if(rectArea(c)>rectArea(best))best=c; });
    return best;

  function philZones(){
    if(!comp||comp.phone)return null;
    var c=cfg();
    var em=(c.editorialMargin||.038), gut=(c.gutter||.035), annW=(c.annotationW||.085);
    var marginL=W*em, marginR=W*(1-em), p=panelBox();

    /* Everything already standing in the field, treated as occupied space.
       The panel is the obvious one — but clearPanel() also RELOCATES any rim
       label the panel blocks into a shared column just right of it, which
       lands squarely in the editorial band. Zones must be cut around where
       the labels actually ended up, not where placeRim() first put them.
       A gutter is added so a zone never begins exactly on an obstacle's edge. */
    var GUT=12;
    var obstacles=[];
    if(p) obstacles.push({x0:p.x0-GUT,y0:p.y0-GUT,x1:p.x1+GUT,y1:p.y1+GUT});
    Object.keys(rim).concat(Object.keys(ring1)).concat(focus?[focus.id]:[]).forEach(function(id){
      var n=byId[id]; if(!n||n.tx===undefined)return;
      var half=Math.min(118,(String(n.label).length*6.1)/2+12);
      obstacles.push({x0:n.tx-half-GUT, y0:n.ty-16-GUT, x1:n.tx+half+GUT, y1:n.ty+38+GUT});
    });

      return z;
    }

    /* The graph band comes from the ACTUAL ring placement, not from the
       nominal topPad/floor pair — those two invert at some viewports (the
       title bottom can sit below the panel top), which produced zones of
       negative height. Cy/ry1 are where the ring really is. */
    var gx0=comp.Cx-comp.rx1-96, gx1=comp.Cx+comp.rx1+96;
    var gy0=comp.Cy-comp.ry1-70, gy1=comp.Cy+comp.ry1+70;
    var graphZone={x0:gx0,y0:gy0,x1:gx1,y1:gy1};

    /* The editorial field, then the four bands the graph leaves behind.
       Which band is "primary" is NOT fixed: Philosophy's anchor sits the
       graph right of centre with the reading panel on the left, so assuming
       a right-hand column left a 0px zone. Rank by the space that actually
       exists and let the composition follow the content. */
    var field={x0:marginL+W*annW, y0:comp.topPad, x1:marginR-W*annW*.5, y1:H-36};
    var bands=[
      {x0:field.x0, y0:gy1+W*gut*.4, x1:field.x1, y1:field.y1},   // below
