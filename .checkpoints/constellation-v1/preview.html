            g.fillStyle='rgba('+(fr.notMine?acc:ink)+','+(tier>=3?(fr.notMine?.55:.42):(fr.notMine?.20:.13))+')';
            g.fillText(fr.mark, fx, fy-(big?26:15));
          }
        }
        /* ── the drawn part of the grid ──────────────────────────────
           Almost nothing. The grid is carried by ALIGNMENT — the shared left
           edges and baseline rhythm above — so what is drawn is only enough
           to register the structure peripherally: the inner edge of the
           primary column, and two ticks marking where it begins and ends.

           GRID_ALPHA is deliberately below the faintest authentic fragment
           (weight 1 sits at .022). The grid may never out-shout the writing;
           an acceptance check enforces the relationship rather than trusting
           this comment. */
        if(Z){
          g.strokeStyle='rgba('+ink+','+GRID_ALPHA+')'; g.lineWidth=1;
          g.beginPath(); g.moveTo(Z.A.x0-14,Z.A.y0); g.lineTo(Z.A.x0-14,Z.A.y1); g.stroke();
          [Z.A.y0,Z.A.y1].forEach(function(ty){
            g.beginPath(); g.moveTo(Z.A.x0-14,ty); g.lineTo(Z.A.x0-2,ty); g.stroke();
          });
          if(rectArea(Z.B)>0){
            g.beginPath(); g.moveTo(Z.B.x0-14,Z.B.y1); g.lineTo(Z.B.x1,Z.B.y1); g.stroke();
          }
        }
        /* ── the marginalia layer ────────────────────────────────────
           This used to be twelve invented footnote numbers ("1." … "12.")
           and seven invented cross-references ("cf. 3" … "cf. 9"), plus nine
           rules at arbitrary positions. None of it referred to anything. It
           was academic-looking decoration, which is the same failure as the
           invented fragments in P4.1.

           Every mark here is now keyed to a fragment that is actually on
           screen, at that fragment's own baseline, and reads a real field:
             right margin — its SOURCE (n.src), the breadcrumb to the writing
             left margin  — where the thought LEAVES this region, from real
                            cross-region edges only
           If a fragment has no such data, nothing is drawn. Empty margin is
           preferable to a mark that refers to nothing. */
        g.strokeStyle='rgba('+ink+',.09)';
        [W*.038,W*.962].forEach(function(mx){ g.beginPath();g.moveTo(mx,H*.09);g.lineTo(mx,H*.91);g.stroke(); });
        if(Z){
          g.textBaseline='alphabetic';
          marginalia=[];
          /* Is there room for this exact box — inside the margin, clear of the
             marks already there, and clear of everything the composition has
             standing in the field? The last test is the one that matters most:
             the mark overhangs the narrow annotation band, so checking the
             band alone let a source string run 30px past Rm.x1 and print over
             the MY WORKS label at 2560. */
          var margFits=function(top,hh,x0,x1){
            if(top<Z.Rm.y0 || top+hh>Z.Rm.y1) return false;
            for(var q=0;q<marginalia.length;q++){
              var o=marginalia[q];
              if(top<o.y+o.h && top+hh>o.y) return false;
            }
            for(var r=0;r<Z.obs.length;r++){
              var b=Z.obs[r];
              if(x1>b.x0 && x0<b.x1 && top+hh>b.y0 && top<b.y1) return false;
            }
            return true;
          };
          fragHits.forEach(function(h){
            var n=byId[h.id]; if(!n)return;
            var strong=(h.ty1-h.ty0)>26;               // a promoted fragment
            var yy=h.ty1, sx=0;
            /* WHERE IT LEAVES — the regions this thought actually reaches,
               from real cross-region edges only.

               This was routed into the LEFT margin, which the reading panel
               swallows at almost every viewport: at 1424x805 clearOf() cut Lm
               down to a 76px sliver at y163–239 while every fragment sat at
               y485–758, so the guard was false for all nine and a required
               feature rendered NOTHING. The check passed anyway, because it
               only asked whether the marks that existed were authentic.

               The destination now sits directly under its own source mark.
               "Came from / leads to" reads as one pair belonging to one
               fragment, rather than an association the eye has to carry
               1200px across the page. The region is compared against n.mig —
               not a hard-coded 'philosophy' — so this can never disagree with
               the graph it is derived from. */
            var outs={};
            adj[n.id].forEach(function(k){
              var o=byId[k.o];
              if(o && o.mig && o.mig!==n.mig) outs[o.mig]=1;
            });
            var dests=Object.keys(outs);
            /* PLACEMENT IS DECIDED FOR THE PAIR, BEFORE ANYTHING IS DRAWN.

               Two lessons are encoded here.

               First, a mark is bounded by its BOX, not its baseline. The
               source mark used to be drawn whenever its BASELINE fell inside
               Rm, but its box runs from yy-9 to yy+3 — so a baseline one pixel
               inside the margin put the box nine pixels ABOVE it, into exactly
               the label Rm had been cut around. At 2560 that put source marks
               over MY WORKS, SOCIETY and BUSINESS. Both marks now go through
               margFits, which tests the box.

               Second, the pair is all-or-nothing. A source mark with no
               destination beside it is indistinguishable from a thought that
               leaves the region nowhere, so half a pair is quietly misleading
               in the one way this whole layer exists to prevent. If the margin
               cannot hold both, it holds neither and the fragment simply has
               no marginalia — the same rule as everywhere else here: an empty
               margin beats a mark that misleads.

               Below the source by preference; at the foot of the margin there
               is no room below — a focused c-curiosity sat at y759 with the
               margin ending at y769 — so the pair flips and the destination
               sits above its source, as a note near the foot of a page does. */
            // MEASURE, then test the real box, then draw — never draw and repair
            var st=n.src?String(n.src):'', sw=0, srcTop=yy-9, srcOk=false;
            if(st){
              g.font='9px '+MONO;
              sw=g.measureText(st).width; sx=Math.min(W*.994-sw, Z.Rm.x0+2);
              srcOk=margFits(srcTop,12,sx,sx+sw);
            }
            var dt='', dw=0, dx=0, crossTop=0;
            if(srcOk && dests.length){
              dt='→ '+byId[dests[0]].label.toLowerCase()+(dests.length>1?' +'+(dests.length-1):'');
              g.font='8.5px '+MONO;
              dw=g.measureText(dt).width; dx=Math.min(W*.994-dw, Z.Rm.x0+2);
              /* Evaluated before the source is pushed. Neither candidate can
                 overlap the source box, which ends exactly where they begin. */
              crossTop = margFits(yy+3,11,dx,dx+dw) ? yy+3
                       : (margFits(yy-20,11,dx,dx+dw) ? yy-20 : 0);
              if(!crossTop) srcOk=false;          // all or nothing
            }
            if(srcOk){
              g.font='9px '+MONO;
              g.fillStyle='rgba('+ink+','+(strong?MARG_ALPHA.src.strong:MARG_ALPHA.src.quiet)+')';
              g.fillText(st, sx, yy);
              marginalia.push({id:h.id,kind:'source',text:st,x:sx,y:srcTop,w:sw,h:12});
              g.strokeStyle='rgba('+ink+','+(strong?.14:.06)+')';
              g.beginPath(); g.moveTo(sx-14,yy-3); g.lineTo(sx-4,yy-3); g.stroke();
              if(crossTop){
                g.font='8.5px '+MONO;
                g.fillStyle='rgba('+acc+','+(strong?MARG_ALPHA.cross.strong:MARG_ALPHA.cross.quiet)+')';
                g.fillText(dt, dx, crossTop+8);
                marginalia.push({id:h.id,kind:'cross',text:dt,x:dx,y:crossTop,w:dw,h:11});
              }
            }
          });
        }
        break; }

      /* HUMAN BEHAVIOUR — translucent strata at different depths, each one
         a motivation the others cannot see through cleanly. */
      case 'strata': {
        for(i=0;i<7;i++){
          var a1=i/7*6.2832, rr=Math.min(W,H)*(.20+i*.045);
          g.fillStyle='rgba('+ink+',.018)';
          g.beginPath();
          g.ellipse(W*.5+Math.cos(a1)*W*.13, H*.44+Math.sin(a1)*H*.13, rr, rr*.72, a1*.4, 0, 6.2832);
          g.fill();
          g.strokeStyle='rgba('+ink+',.05)'; g.stroke();
        }
        g.strokeStyle='rgba('+acc+',.07)';
        for(i=0;i<4;i++){ y=H*(.24+i*.17); g.beginPath();
          for(x=0;x<=W;x+=16) g.lineTo(x, y+Math.sin(x*.006+i)*10); g.stroke(); }
        if(onIdea){                       // a plane gathers at the depth of the idea
          g.fillStyle='rgba('+rgbStr(cfg().tone||[60,138,143])+',.055)';
          g.beginPath();g.ellipse(FX,FY,Math.min(W,H)*.30,Math.min(W,H)*.19,0,0,6.2832);g.fill();
          g.strokeStyle='rgba('+rgbStr(cfg().tone||[60,138,143])+',.16)'; g.stroke();
        }
        break; }

      /* BUSINESS — white architecture. A strict grid, heavy structural
         members, and large deliberately empty fields. */
      case 'architect': {
        g.strokeStyle='rgba('+ink+',.10)';
        for(i=0;i<=12;i++){ x=W*i/12; g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke(); }
        for(i=0;i<=7;i++){ y=H*i/7; g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke(); }
        g.strokeStyle='rgba('+ink+',.30)'; g.lineWidth=2;
        g.beginPath();g.moveTo(W/12,0);g.lineTo(W/12,H);g.stroke();
        g.beginPath();g.moveTo(0,H*6/7);g.lineTo(W,H*6/7);g.stroke();
        g.lineWidth=1;
        g.fillStyle='rgba('+ink+',.035)';
        g.fillRect(W/12,H*4/7,W*3/12,H*2/7);
        g.fillRect(W*8/12,H/7,W*3/12,H*2/7);
        g.strokeStyle='rgba('+acc+',.35)';
        g.beginPath();g.moveTo(W*8/12,H/7);g.lineTo(W*11/12,H/7);g.stroke();
        // everything here organises itself around the thing under discussion
        if(onIdea){
          g.strokeStyle='rgba('+acc+',.30)'; g.lineWidth=1.4;
          g.beginPath();g.moveTo(0,FY);g.lineTo(W,FY);g.stroke();
          g.beginPath();g.moveTo(FX,0);g.lineTo(FX,H);g.stroke();
          g.lineWidth=1;
          g.strokeStyle='rgba('+ink+',.22)';
          g.strokeRect(FX-W*.14,FY-H*.13,W*.28,H*.26);
        }
        break; }

      /* TECHNOLOGY — modular. Components, buses, and the quiet annotation
         of a system diagram. */
      case 'modular': {
        g.fillStyle='rgba('+ink+',.075)';
        for(i=24;i<W;i+=38) for(j=24;j<H;j+=38) g.fillRect(i,j,1.5,1.5);
        g.strokeStyle='rgba('+ink+',.09)';
        var mods=[[.06,.10,.16,.13],[.06,.30,.16,.10],[.78,.14,.16,.16],[.78,.40,.16,.10],[.30,.74,.40,.14]];
        mods.forEach(function(r){ g.strokeRect(W*r[0],H*r[1],W*r[2],H*r[3]); });
        g.strokeStyle='rgba('+acc+',.16)';
        g.beginPath();g.moveTo(W*.22,H*.165);g.lineTo(W*.50,H*.165);g.lineTo(W*.50,H*.74);g.stroke();
        g.beginPath();g.moveTo(W*.78,H*.22);g.lineTo(W*.62,H*.22);g.lineTo(W*.62,H*.60);g.stroke();
        g.font='9px '+MONO; g.fillStyle='rgba('+ink+',.14)';
        ['io','core','bus','store','runtime'].forEach(function(t,k){
          g.fillText(t, W*mods[k][0]+6, H*mods[k][1]+14);
        });
        // the system reconfigures: a module forms around the selected component
        if(onIdea){
          g.strokeStyle='rgba('+acc+',.34)';
          g.strokeRect(FX-W*.115,FY-H*.115,W*.23,H*.23);
          [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(function(c){
            g.beginPath();
            g.moveTo(FX+c[0]*W*.115, FY+c[1]*H*.115-c[1]*12);
            g.lineTo(FX+c[0]*W*.115, FY+c[1]*H*.115);
            g.lineTo(FX+c[0]*W*.115-c[0]*14, FY+c[1]*H*.115);
            g.stroke();
          });
        }
        break; }

      /* BUILDING — blueprint. Measured, dimensioned, mid-assembly. */
      case 'blueprint': {
        g.strokeStyle='rgba('+ink+',.055)';
        for(i=0;i<=W;i+=44){ g.beginPath();g.moveTo(i,0);g.lineTo(i,H);g.stroke(); }
        for(i=0;i<=H;i+=44){ g.beginPath();g.moveTo(0,i);g.lineTo(W,i);g.stroke(); }
        g.strokeStyle='rgba('+ink+',.16)';
        g.strokeRect(W*.055,H*.085,W*.89,H*.80);
        for(i=0;i<=W*.89;i+=22){
          var t=(i%88===0)?12:6;
          g.beginPath();g.moveTo(W*.055+i,H*.885);g.lineTo(W*.055+i,H*.885+t/H*100);g.stroke();
        }
        g.strokeStyle='rgba('+acc+',.22)';
        g.beginPath();g.moveTo(W*.055,H*.925);g.lineTo(W*.944,H*.925);g.stroke();
        [W*.055,W*.944].forEach(function(ex){ g.beginPath();g.moveTo(ex,H*.912);g.lineTo(ex,H*.938);g.stroke(); });
        g.font='9px '+MONO; g.fillStyle='rgba('+ink+',.16)';
        g.fillText('rev 0.4', W*.062, H*.072); g.fillText('scale 1:1', W*.862, H*.072);
        break; }

      /* LEARNING — a model assembling itself: branches, and the gaps
         between what is known and what is not. */
      case 'growth': {
        g.strokeStyle='rgba('+ink+',.085)';
        (function grow(x0,y0,ang,len,d){
          if(d>5||len<10)return;
          var x1=x0+Math.cos(ang)*len, y1=y0+Math.sin(ang)*len;
          g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke();
          if(d===4){ g.fillStyle='rgba('+acc+',.16)'; g.beginPath();g.arc(x1,y1,2,0,6.2832);g.fill(); }
          grow(x1,y1,ang-.40,len*.74,d+1); grow(x1,y1,ang+.40,len*.74,d+1);
        })(W*.5,H*.99,-Math.PI/2,H*.22,0);
        g.setLineDash([3,6]); g.strokeStyle='rgba('+ink+',.06)';
        for(i=1;i<4;i++){ y=H*(.20+i*.16); g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke(); }
        g.setLineDash([]);
        break; }

      /* OBSERVATION — a notebook that happens to be alive. Underlines,
         crop marks, things circled for later. */
      case 'annotate': {
        g.strokeStyle='rgba('+ink+',.13)';
        for(i=0;i<22;i++){
          x=(i*197)%(W*.9)+W*.04; y=(i*151)%(H*.8)+H*.10;
          var wd=26+((i*61)%90);
          g.beginPath();g.moveTo(x,y);g.lineTo(x+wd,y);g.stroke();
          if(i%4===0){ g.beginPath();g.moveTo(x,y+4);g.lineTo(x+wd*.55,y+4);g.stroke(); }
        }
        g.strokeStyle='rgba('+acc+',.22)';
        [[.14,.26,54],[.68,.52,40],[.40,.76,62]].forEach(function(c){
          g.beginPath();g.ellipse(W*c[0],H*c[1],c[2],c[2]*.55,-.25,0,6.2832);g.stroke();
        });
        g.strokeStyle='rgba('+ink+',.20)';
        [[.035,.07],[.965,.07],[.035,.93],[.965,.93]].forEach(function(p){
          g.beginPath();g.moveTo(W*p[0]-9,H*p[1]);g.lineTo(W*p[0]+9,H*p[1]);
          g.moveTo(W*p[0],H*p[1]-9);g.lineTo(W*p[0],H*p[1]+9);g.stroke();
        });
        break; }

      /* LIFE — one horizon, a great deal of nothing, and small distant marks. */
      case 'horizon': {
        g.strokeStyle='rgba('+ink+',.14)';
        g.beginPath();g.moveTo(0,H*.66);g.lineTo(W,H*.66);g.stroke();
        var grd2=g.createLinearGradient(0,H*.66,0,H);
        grd2.addColorStop(0,'rgba('+ink+',.035)'); grd2.addColorStop(1,'rgba('+ink+',0)');
        g.fillStyle=grd2; g.fillRect(0,H*.66,W,H*.34);
        g.fillStyle='rgba('+ink+',.10)';
        for(i=0;i<40;i++){ x=(i*263)%W; y=H*.10+((i*97)%(H*.5)); g.fillRect(x,y,1.2,1.2); }
        g.strokeStyle='rgba('+acc+',.10)';
        for(i=0;i<3;i++){ g.beginPath();g.arc(W*.5,H*.66,Math.min(W,H)*(.22+i*.16),Math.PI,6.2832);g.stroke(); }
        break; }

      /* MUSIC — rhythm, not interface. Almost nothing but intervals. */
      case 'pulse': {
        // near-total silence. Only the beat, and only where it falls.
        var bx=W*.10, span=W*.80, keep=g.globalAlpha;
        g.strokeStyle='rgba('+ink+',.16)';
        for(i=0;i<=16;i++){
          x=bx+span*i/16;
          var strong=(i%4===0);
          g.globalAlpha=keep*(strong?.9:.34);
          g.beginPath();g.moveTo(x,H*.915-(strong?H*.032:H*.011));g.lineTo(x,H*.915);g.stroke();
        }
        g.globalAlpha=keep;
        // an open idea marks its own intervals across the field
        if(onIdea){
          g.strokeStyle='rgba('+acc+',.22)';
          for(i=-2;i<=2;i++){
            if(!i)continue;
            x=FX+i*(W*.085);
            g.beginPath();g.moveTo(x,FY-H*.05);g.lineTo(x,FY+H*.05);g.stroke();
          }
        }
        break; }

      /* MOVIES — framed and sequential. Letterbox, then cuts. */
      case 'frame': {
        g.fillStyle='rgba('+ink+',.045)';
        g.fillRect(0,0,W,H*.085); g.fillRect(0,H*.915,W,H*.085);
        g.strokeStyle='rgba('+ink+',.12)';
        g.beginPath();g.moveTo(0,H*.085);g.lineTo(W,H*.085);
        g.moveTo(0,H*.915);g.lineTo(W,H*.915);g.stroke();
        g.strokeStyle='rgba('+ink+',.075)';
        for(i=1;i<4;i++){ x=W*i/4; g.beginPath();g.moveTo(x,H*.085);g.lineTo(x,H*.915);g.stroke(); }
        g.font='9px '+MONO; g.fillStyle='rgba('+acc+',.26)';
        for(i=0;i<4;i++) g.fillText('0'+(i+1), W*i/4+12, H*.13);
        break; }

      /* FOOD — tactile. Grain, and things cropped close. */
      case 'tactile': {
        g.fillStyle='rgba('+ink+',.06)';
        for(i=0;i<2600;i++){ x=(i*7919)%W; y=(i*104729)%H; g.fillRect(x,y,1.2,1.2); }
        g.strokeStyle='rgba('+ink+',.10)';
        [[.04,.12,.20,.26],[.76,.18,.20,.22],[.30,.70,.24,.22],[.62,.66,.16,.26]].forEach(function(r){
          g.strokeRect(W*r[0],H*r[1],W*r[2],H*r[3]);
        });
        g.strokeStyle='rgba('+acc+',.13)';
        g.beginPath();
        for(x=0;x<=W;x+=12) g.lineTo(x,H*.46+Math.sin(x*.009)*16+Math.sin(x*.021)*7);
        g.stroke();
        break; }

      /* SOCIETY — an assembly. Many small identical marks arranged into a body,
         a floor they all stand on, and one mark that has stepped out of line. */
      case 'assembly': {
        var tnS=rgbStr(cfg().tone||[108,124,148]);
        g.fillStyle='rgba('+ink+',.075)';
        for(i=0;i<15;i++) for(j=0;j<9;j++){
          x=W*.09+i*(W*.058); y=H*.16+j*(H*.062);
          if(y>H*.80)continue;
          g.fillRect(x,y,3,3);
        }
        g.strokeStyle='rgba('+ink+',.13)';
        g.beginPath();g.moveTo(W*.06,H*.845);g.lineTo(W*.94,H*.845);g.stroke();
        // the one that stepped out of the row
        g.fillStyle='rgba('+tnS+',.55)';
        g.fillRect(W*.09+7*(W*.058), H*.16+4*(H*.062)-9, 3, 3);
        g.strokeStyle='rgba('+tnS+',.26)';
        g.beginPath();
        g.arc(W*.09+7*(W*.058)+1.5, H*.16+4*(H*.062)-7.5, 13, 0, 6.2832);
        g.stroke();
        if(onIdea){                       // the body turns toward what is raised
          g.strokeStyle='rgba('+acc+',.20)';
          for(i=0;i<7;i++){
            var a2=Math.PI*(1.1+i*.13);
            g.beginPath();
            g.moveTo(FX+Math.cos(a2)*W*.14, FY+Math.sin(a2)*H*.12);
            g.lineTo(FX+Math.cos(a2)*W*.09, FY+Math.sin(a2)*H*.08);
            g.stroke();
          }
        }
        break; }

      /* MY WORKS — a working archive. Shelf lines, artifacts standing on them,
         build numbers in the margin. Evidence, not a portfolio wall. */
      case 'archive': {
        var tn=rgbStr(cfg().tone||[62,100,145]);
        g.strokeStyle='rgba('+ink+',.14)';
        for(i=0;i<4;i++){ y=H*(.22+i*.19);
          g.beginPath();g.moveTo(W*.06,y);g.lineTo(W*.94,y);g.stroke(); }
        g.strokeStyle='rgba('+tn+',.32)'; g.fillStyle='rgba('+ink+',.035)';
        for(i=0;i<24;i++){
          var sh=Math.floor(i/6), bw=16+((i*37)%46), bh=13+((i*53)%38);
          y=H*(.22+sh*.19);
          x=W*.078+(i%6)*(W*.142)+((i*29)%20);
          g.fillRect(x,y-bh,bw,bh); g.strokeRect(x,y-bh,bw,bh);
        }
        g.font='9px '+MONO; g.fillStyle='rgba('+ink+',.22)';
        ['shipped','running','answered','shelved'].forEach(function(t,k){
          g.fillText(t, W*.062, H*(.22+k*.19)+13);
        });
        g.fillStyle='rgba('+tn+',.36)';
        for(i=0;i<4;i++) g.fillText('build 0'+(4-i), W*.895, H*(.22+i*.19)+13);
        break; }

      /* LOVE — two sides, and the distance between them held open. */
      case 'apart': {
        g.strokeStyle='rgba('+ink+',.09)';
        g.beginPath();g.moveTo(W*.5,H*.06);g.lineTo(W*.5,H*.94);g.stroke();
        g.strokeStyle='rgba('+ink+',.13)';
        for(i=0;i<9;i++){
          y=H*(.14+i*.085);
          var reach=W*(.06+i*.014);
          g.beginPath();g.moveTo(W*.5-W*.045-reach,y);g.lineTo(W*.5-W*.045,y);g.stroke();
          g.beginPath();g.moveTo(W*.5+W*.045,y);g.lineTo(W*.5+W*.045+reach,y);g.stroke();
        }
        g.fillStyle='rgba('+acc+',.22)';
        g.fillRect(W*.5-1,H*.46,2,H*.08);
        if(onIdea){                       // the two sides lean toward the open idea
          g.strokeStyle='rgba('+acc+',.26)';
          g.beginPath();g.moveTo(W*.5-W*.10,FY);g.lineTo(W*.5-W*.016,FY);g.stroke();
          g.beginPath();g.moveTo(W*.5+W*.016,FY);g.lineTo(W*.5+W*.10,FY);g.stroke();
        }
        break; }
    }
    g.globalAlpha=1;
  }

  function refreshMotif(){
    if(!W||!H)return;
    if(!motifCv){ var a=newLayer(),b=newLayer(); motifCv=a.c;motifCtx=a.x; prevCv=b.c;prevCtx=b.x; }
    [motifCv,prevCv].forEach(function(c){
      if(c.width!==Math.round(W*dpr)||c.height!==Math.round(H*dpr)){ c.width=Math.round(W*dpr); c.height=Math.round(H*dpr); }
    });
    var m=currentMig(), kind=(mode()==='world'?'none':cfg().env)+'|'+(m?m.id:'-')+'|'+mode();
    if(kind!==lastMotif){
      prevCtx.setTransform(1,0,0,1,0,0); prevCtx.clearRect(0,0,prevCv.width,prevCv.height);
      prevCtx.drawImage(motifCv,0,0);
      fadeStart=performance.now(); lastMotif=kind;
    }
    var paint=function(){ paintMotif(motifCtx, mode()==='world'?'none':cfg().env); };
    paint();
    motifT.forEach(clearTimeout); motifT=[];
    [220,520,900,1400].forEach(function(ms){ motifT.push(setTimeout(paint,ms)); });
  }

  /* Ambient motion. On the map everything drifts alike; inside a world the
     world decides how it moves — and some worlds hold perfectly still. */
  function drift(n,tm){
    if(reduced)return[0,0];
    if(!focus){
      var s=(n.t==='mig'?2.2:3.4);
      return [Math.sin(tm/2700+n.seed)*s, Math.cos(tm/3300+n.seed*1.7)*s];
    }
    var sw=cfg().sway;
    if(!sw)return[0,0];                                  // precise worlds do not move
    if(sw==='beat'){                                     // music: one pulse, everything on it
      return [0, -(Math.sin(tm/900)*.5+.5)*3.4];
    }
    if(sw==='breathe'){                                  // love: toward, and away
      var p=Math.sin(tm/4200+n.seed*.3), dx=n.cx-W*.5;
      return [(dx<0?-1:1)*p*5.0, 0];
    }
    return [Math.sin(tm/sw[1]+n.seed)*sw[0], Math.cos(tm/(sw[1]*1.24)+n.seed*1.7)*sw[0]];
  }
  function alphaOf(n){
    var m=mode();
    if(m==='world') return n.t==='mig'?1:(n.t==='minor'?.20:.12);
    if(n===focus)return 1;
    if(ring1[n.id])return .92;
    if(rim[n.id])return .46;
    if(ring2[n.id])return .28;
    return .06;
  }

  function shape(n,X,Y,a,isSel){
    var col=isSel?ACC(a):INK(a);
        ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=isSel?1.8:1.35;
    if(n.t==='mig'){
      var r=(mode()==='world'?7.4:6.2)*(isSel?1.25:1);
      ctx.beginPath();ctx.arc(X,Y,r-3.4,0,6.2832);ctx.fill();
      ctx.globalAlpha=.5;ctx.beginPath();ctx.arc(X,Y,r+2.6,0,6.2832);ctx.stroke();
      ctx.globalAlpha=.22;ctx.beginPath();ctx.arc(X,Y,r+8,0,6.2832);ctx.stroke();
      ctx.globalAlpha=1;return;
    }
    var r2=(n.t==='minor'?(n.g?6.4:5.6):5.0)*(isSel?1.28:1);
    switch(n.t){
      case 'minor':
        ctx.beginPath();ctx.arc(X,Y,r2-2.2,0,6.2832);ctx.fill();
        if(n.g){ctx.globalAlpha=.42;ctx.beginPath();ctx.arc(X,Y,r2+4.6,0,6.2832);ctx.stroke();ctx.globalAlpha=1;}
        break;
      case 'thought': ctx.beginPath();ctx.arc(X,Y,r2-.6,0,6.2832);ctx.fill();break;
      case 'belief':  ctx.beginPath();ctx.arc(X,Y,r2-.4,0,6.2832);ctx.stroke();break;
      case 'question':
        ctx.beginPath();ctx.moveTo(X,Y-r2-1.8);ctx.lineTo(X+r2+1.8,Y);ctx.lineTo(X,Y+r2+1.8);ctx.lineTo(X-r2-1.8,Y);
        ctx.closePath();ctx.stroke();break;
      case 'project': ctx.fillRect(X-r2,Y-r2,r2*2,r2*2);break;
      case 'experiment':
        ctx.beginPath();ctx.arc(X,Y,r2-.8,0,6.2832);ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(X,Y-r2-4.6);ctx.lineTo(X,Y-r2+.6);ctx.moveTo(X,Y+r2-.6);ctx.lineTo(X,Y+r2+4.6);
        ctx.moveTo(X-r2-4.6,Y);ctx.lineTo(X-r2+.6,Y);ctx.moveTo(X+r2-.6,Y);ctx.lineTo(X+r2+4.6,Y);
        ctx.stroke();break;
      case 'contradiction':
        ctx.strokeStyle=ACC(Math.min(1,a+.2));
        ctx.beginPath();ctx.arc(X-3.9,Y,3.9,0,6.2832);ctx.stroke();
        ctx.beginPath();ctx.arc(X+3.9,Y,3.9,0,6.2832);ctx.stroke();break;
      case 'person':
        ctx.beginPath();ctx.arc(X,Y,r2+1.6,0,6.2832);ctx.stroke();
        ctx.beginPath();ctx.arc(X,Y,r2-2.6,0,6.2832);ctx.fill();break;
      case 'reference': ctx.fillRect(X-r2-2.6,Y-1.2,(r2+2.6)*2,2.4);break;
    }
  }

  /* ── One edge, drawn one way, in every world. Relationships belong to
     the neuron system, and the neuron system is what stays constant. ── */
  function edgePath(kind,ax,ay,bx,by){
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by);
  }

  var MONO="ui-monospace,'Cascadia Mono',Consolas,monospace";
  function plate(txt,X,Y,size){
    ctx.font=size+'px '+MONO;
    var w=ctx.measureText(txt).width;
    ctx.fillStyle=GROUND(.9);
    ctx.fillRect(X-w/2-5,Y-size/2-3,w+10,size+6);
  }

  function draw(now){
    var tm=now-t0, c=cfg();
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='rgb('+rgbStr(envRGB)+')';ctx.fillRect(0,0,W,H);
    lit+=((entered?1:0)-lit)*.05;
    var wc=cfg(), ek=reduced?1:.055;
    for(var ci=0;ci<3;ci++){
      envRGB[ci]+=(wc.ground[ci]-envRGB[ci])*ek;
      inkRGB[ci]+=(wc.ink[ci]-inkRGB[ci])*ek;
      accRGB[ci]+=(wc.accent[ci]-accRGB[ci])*ek;
    }

    NODES.forEach(function(n){
      var k=reduced?1:(wc.ease||.085);   // business snaps, life drifts
      n.cx+=(n.tx-n.cx)*k; n.cy+=(n.ty-n.cy)*k;
    });

    if(entered&&motifCv){
      var f=reduced?1:Math.min(1,(now-fadeStart)/700);
      if(f<1){ ctx.globalAlpha=lit*(1-f); ctx.drawImage(prevCv,0,0,W,H); }
      ctx.globalAlpha=lit*f; ctx.drawImage(motifCv,0,0,W,H);
      ctx.globalAlpha=1;
    }

    var m=mode();
    EDGES.forEach(function(e){
      var a=byId[e[0]],b=byId[e[1]];
      var da=drift(a,tm),db=drift(b,tm);
      var ax=a.cx+da[0],ay=a.cy+da[1],bx=b.cx+db[0],by=b.cy+db[1];
      var radial=focus&&m!=='mig'&&(a===focus||b===focus);
      var isHov=hoverEdge===e;
      var dim=Math.min(alphaOf(a),alphaOf(b));
      var kind='straight';   // the neuron system is the constant

      edgePath(kind,ax,ay,bx,by);
      ctx.lineWidth=isHov?1.5:(radial?1.15:.85);
      ctx.strokeStyle=(radial||isHov)
        ? ACC((isHov?.95:.62)*(entered?1:.34))
        : INK(Math.min(.20,dim*.24)*(entered?1:.34));
      /* A tension is the one relationship that does not want to close. It is
         drawn as the same line, interrupted — the two ideas are connected
         precisely because they resist each other. This varies by RELATIONSHIP
         TYPE, which is the semantic vocabulary, never by world. */
      if(isTension(e)) ctx.setLineDash(radial?[7,6]:[4,5]);
      ctx.stroke();
      ctx.setLineDash([]);

      if(entered&&radial){
        var fr=(a===focus)?.43:.57;
        var lx=ax+(bx-ax)*fr,ly=ay+(by-ay)*fr;
        var txt=e[2].toUpperCase();
        plate(txt,lx,ly,9);
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillStyle=isHov?ACC(.98):ACC(.8);
        ctx.fillText(txt,lx,ly);
      }
    });

    // a minor IG is tethered to the MIG that owns it
    if(entered&&focus&&m==='focus'){
      var Hm=byId[focus.mig];
      if(Hm&&rim[Hm.id]){
        ctx.beginPath();ctx.moveTo(focus.cx,focus.cy);ctx.lineTo(Hm.cx,Hm.cy);
        ctx.strokeStyle=INK(.14);ctx.lineWidth=.8;
        ctx.setLineDash([2,5]);ctx.stroke();ctx.setLineDash([]);
      }
    }

    if(pulseEdge){
      var k2=(now-pulseStart)/2400;
      if(k2>=1||entered){pulseEdge=null;}
      else{
        var pa=byId[pulseEdge[0]],pb=byId[pulseEdge[1]],g2=Math.sin(k2*Math.PI);
        ctx.beginPath();ctx.moveTo(pa.cx,pa.cy);ctx.lineTo(pb.cx,pb.cy);
        ctx.strokeStyle=ACC(g2*.34);ctx.lineWidth=1;ctx.stroke();
      }
    }

    if(entered&&focus&&emergeTop&&focus.cy+22<emergeTop){
      ctx.beginPath();ctx.moveTo(focus.cx,focus.cy+20);ctx.lineTo(focus.cx,emergeTop-8);
      ctx.strokeStyle=ACC(.3);ctx.lineWidth=1;ctx.stroke();
    }

    NODES.forEach(function(n){
      var d=drift(n,tm);
      shape(n,n.cx+d[0],n.cy+d[1],alphaOf(n)*(entered?1:.34),focus===n);
    });

    /* Where the keyboard is. The parallel layer is visually hidden, so
       without this a sighted keyboard user would be moving an invisible
       cursor. Same mark as the browser's focus ring, put where the idea
       actually is. */
    var kf=navFocusId();
    if(entered&&kf&&byId[kf]){
      var fn=byId[kf], fd=drift(fn,tm);
      ctx.beginPath();ctx.arc(fn.cx+fd[0],fn.cy+fd[1],15,0,6.2832);
      ctx.strokeStyle=ACC(.95);ctx.lineWidth=1.4;ctx.stroke();
      ctx.beginPath();ctx.arc(fn.cx+fd[0],fn.cy+fd[1],19,0,6.2832);
      ctx.strokeStyle=ACC(.3);ctx.lineWidth=1;ctx.stroke();
    }

    if(entered){
      // Thirteen border labels cannot share 375px without colliding, and the
      // sheet below already lists every one of them by name. On a phone the
      // canvas labels only what you are standing on.
      var ph=phone();
      NODES.forEach(function(n){
        var show = m==='world' ? (n.t==='mig'||hover===n)
                               : (n===focus||ring1[n.id]||rim[n.id]||poleIds[n.id]||hover===n);
        if(ph && m!=='world') show = (n===focus);
        if(ph && m==='world') show = (n.t==='mig');
        if(!show)return;
        var d=drift(n,tm),X=n.cx+d[0],Y=n.cy+d[1];
        var isSel=focus===n,isHov=hover===n,isMig=n.t==='mig';
        var txt=n.label.length>28?n.label.slice(0,26)+'…':n.label;
        var size=isMig?11:10, off=isMig?(m==='world'?26:22):18;
        ctx.font=size+'px '+MONO;
        if(ctx.letterSpacing!==undefined) ctx.letterSpacing=isMig?'.18em':'0em';
        if(isSel||isHov)plate(txt,X,Y+off,size);
        ctx.textAlign='center';ctx.textBaseline='middle';
        var la=isSel?1:(isHov?.95:(isMig?(rim[n.id]?.5:.82):(ring1[n.id]?.66:.6)));
        ctx.fillStyle=isSel?ACC(1):INK(la*lit);
        ctx.fillText(txt,X,Y+off);
        if(ctx.letterSpacing!==undefined) ctx.letterSpacing='0em';
      });
    }
    requestAnimationFrame(draw);
  }

  /* ── hit testing ── */
  function nodeAt(mx,my,touch){
    // a mouse cursor is a point; a fingertip is not. 44px minimum on touch.
    var tm=performance.now()-t0,best=null,bd=touch?26:18;
    NODES.forEach(function(n){
      if(alphaOf(n)<.15)return;
      var d=drift(n,tm),dd=Math.hypot(n.cx+d[0]-mx,n.cy+d[1]-my);
      var r=touch?26:(n.t==='mig'?22:bd);
      if(dd<r&&dd<bd+4){bd=Math.min(bd,dd);best=n;}
    });
    return best;
  }
  function edgeAt(mx,my){
    if(!focus||mode()==='mig')return null;
    var tm=performance.now()-t0,best=null,bd=7;
    EDGES.forEach(function(e){
      var a=byId[e[0]],b=byId[e[1]];
      if(a!==focus&&b!==focus)return;
      var da=drift(a,tm),db=drift(b,tm);
      var ax=a.cx+da[0],ay=a.cy+da[1],bx=b.cx+db[0],by=b.cy+db[1];
      var vx=bx-ax,vy=by-ay,L=vx*vx+vy*vy||1;
      var t=Math.max(0,Math.min(1,((mx-ax)*vx+(my-ay)*vy)/L));
      var d=Math.hypot(ax+vx*t-mx,ay+vy*t-my);
      if(d<bd){bd=d;best=e;}
    });
    return best;
  }

  /* ── content ── */
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function bfs(from,test,maxHops){
    var seen={},q=[[from,0]];seen[from]=1;
    while(q.length){
      var c=q.shift(),id=c[0],h=c[1];
      if(h>0&&test(byId[id]))return id;
      if(h>=maxHops)continue;
      adj[id].forEach(function(k){if(!seen[k.o]){seen[k.o]=1;q.push([k.o,h+1]);}});
    }
    return null;
  }
  // where this idea leaves its own region, and through what
  function crossings(n){
    var seen={},list=[];
    adj[n.id].forEach(function(k){
      var o=byId[k.o];
      if(o.mig===n.mig||seen[o.mig])return;
      seen[o.mig]=1; list.push({mig:o.mig,via:o.id,verb:k.e[2],why:k.e[3]});
    });
    (n.crosses||[]).forEach(function(mid){
      if(mid===n.mig||seen[mid])return;
      seen[mid]=1; list.push({mig:mid,via:null});
    });
    return list.slice(0,3);
  }

  function render(n){
    var html='';
    if(n.t==='mig'){
      var mem=minorsOf(n.id).map(function(id){return byId[id];})
              .sort(function(a,b){return (b.g?1:0)-(a.g?1:0);});
      // A region has two kinds of thing in it, and they are not the same kind
      // of thing: concepts you can walk through, and writings you can read.
      var writ=owned[n.id].map(function(id){return byId[id];})
                 .filter(function(x){return x.t!=='minor';});
      var body='';
      if(!mem.length && !writ.length){
        body='<div class="lives empty"><p>This region is empty. There is no written '+
             'material behind it yet, and inventing some would make the rest of this '+
             'less trustworthy.</p></div>';
      }else{
        if(mem.length) body+='<div class="grouphd mono">Concepts</div><div class="lives">'+
          mem.map(function(mn){
            var reach=(mn.crosses||[]).length;
            return '<button data-go="'+mn.id+'">'+esc(mn.label)+
                   (reach?'<em>reaches '+reach+' other'+(reach>1?'s':'')+'</em>':'')+'</button>';
          }).join('')+'</div>';
        if(writ.length) body+='<div class="grouphd mono">Writing <b>'+writ.length+'</b></div>'+
          '<div class="reads">'+writ.map(function(w){
            return '<button data-read="'+w.id+'"><span class="k">'+esc(kindOf(w))+'</span>'+
                   '<span class="ttl">'+esc(w.label.toLowerCase())+'</span></button>';
          }).join('')+'</div>';
      }
      html+='<span class="kind mono">Region</span>'+
            '<h2>'+esc(n.label.toLowerCase())+'</h2>'+
            '<p class="said">'+esc(n.line)+'</p>'+ body +
            '<div class="acts"><button data-wander="1">Wander from here →</button></div>';
    }else{
      var acts=[];
      if(inc[n.id].length) acts.push(['See where it started',inc[n.id][0]]);
      if(out[n.id].length) acts.push(['See what it became',out[n.id][out[n.id].length-1]]);
      var built=bfs(n.id,function(m){return m.t==='project'||m.t==='experiment';},2);
      if(built) acts.push(['See what I built from it',built]);
      var tension=bfs(n.id,function(m){return m.t==='contradiction';},2);
      if(tension) acts.push(['See what contradicts it',tension]);

      var cross=crossings(n);
      // register sits beside state so a joke can never be read as a conviction,
      // and a sourced line says which document it came out of
      var reg = n.register? '<i>·</i>'+esc(n.register) : '';
      var src = n.src? '<div class="srcline mono">from '+esc(n.src)+'</div>' : '';
      html+='<span class="kind mono">'+esc(n.t==='minor'?'concept':n.t)+'<i>·</i>'+esc(n.state)+reg+'</span>'+
            '<h2>'+esc(n.label.toLowerCase())+'</h2>'+
            '<p class="said">'+esc(n.line)+'</p>'+ src +
            '<div class="why" id="why"><p class="idle">'+
              adj[n.id].length+' connections. Move over one to see why it is there.</p></div>'+
            (cross.length?'<div class="cross"><span class="lbl">This idea crosses into</span>'+
              cross.map(function(c){
                return '<button data-go="'+c.mig+'">'+esc(byId[c.mig].label.toLowerCase())+
                       '<b>'+(c.via?'via '+esc(byId[c.via].label):'follow the connection')+' →</b></button>';
              }).join('')+'</div>':'')+
            '<div class="acts">'+
              acts.map(function(a){return '<button data-go="'+a[1]+'">'+esc(a[0])+' →</button>';}).join('')+
              '<button data-wander="1">Wander from here →</button>'+
            '</div>';
    }
    emerge.innerHTML=html;
    emerge.classList.add('on');
    measureEmerge();
  }

  function showWhy(e){
    var el=document.getElementById('why'); if(!el)return;
    el.innerHTML='<span class="rel">'+esc(byId[e[0]].label)+' &nbsp;'+esc(e[2])+'&nbsp; '+esc(byId[e[1]].label)+'</span>'+
                 '<p>“'+esc(e[3])+'”</p>';
  }
  function clearWhy(){
    var el=document.getElementById('why');
    if(el&&focus)el.innerHTML='<p class="idle">'+adj[focus.id].length+' connections. Move over one to see why it is there.</p>';
  }

  var mindBtn=document.getElementById('mindBtn');
  /* ── what kind of thing is this ──────────────────────────────
     The site has three tiers and the visitor should never have to guess
     which one they are looking at: a REGION, a CONCEPT, or a WRITING. */
  var KIND={belief:'Belief',thought:'Writing',question:'Open question',
            contradiction:'Contradiction',project:'Project',experiment:'Experiment',
            person:'Influence',reference:'Quote',minor:'Concept',mig:'Region'};
  function kindOf(n){
    if(n.register==='long-form essay'||n.register==='reflective monologue') return 'Essay';
    if(n.register&&n.register.indexOf('joke')===0) return 'Joke';
    if(n.register==='quote — not mine') return 'Quote';
    return KIND[n.t]||'Writing';
  }
  function isWriting(n){ return n.t!=='mig' && n.t!=='minor'; }

  /* ══════════════════════════════════════════════════════════════
     THE READING PAGE — built as a document

     Screen one is the title page: the writing alone, in the middle,
     nothing else. Scroll and the file opens underneath it — what
     kind of statement it is, where it came from, why it connects,
     where it lets you out.

     Every sentence the file adds is a statement about the DATA —
     its type, its state, its register, its source, its neighbours.
     The file never explains what he meant. It has no way of knowing.
     ══════════════════════════════════════════════════════════════ */

  /* what the site's own vocabulary means, defined once, in the file's
     voice — never presented as something Siddhesh said */
  var STATE_NOTE={
    seed:'Filed as a seed: written down before it was worked out.',
    growing:'Filed as growing: still being added to, and not yet a final shape.',
    formed:'Filed as formed: settled enough to state plainly, and not closed to argument.',
    tested:'Filed as tested: put into practice rather than only asserted.',
    proven:'Filed as proven: it has held up in practice, over time.',
    changed:'Filed as changed: an earlier version of this was held, and is not any more.',
    open:'Filed as open: unresolved on purpose.'
  };
  var TYPE_NOTE={
    belief:'A belief — something held, rather than an argument being made.',
    thought:'A thought, written down. Not defended here, and not withdrawn.',
    question:'An open question. It is not answered anywhere in this file.',
    contradiction:'A contradiction, kept rather than tidied away. Both halves are his.',
    project:'Something he built.',
    experiment:'Something he tried in order to find out.',
    person:'An influence — somebody whose way of thinking is inside his own.',
    reference:'Somebody else’s words, kept because they were useful to him.'
  };
  /* the note has to agree with the label on the title page: a piece filed as a
     joke says JOKE at the top and must not describe itself as a thought below */
  function typeNote(n){
    var k=kindOf(n);
    if(k==='Essay') return 'An essay — a longer piece, written out rather than compressed into a line.';
    if(k==='Joke')  return 'A joke, and kept as one so that it is never read as a conviction.';
    if(k==='Quote') return TYPE_NOTE.reference;
    return TYPE_NOTE[n.t]||'A piece of writing.';
  }
  var NUMW=['no','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve'];
  function numw(n){ return NUMW[n]||String(n); }
  function pad2(n){ return (n<10?'0':'')+n; }
  function flat(s){ return String(s).toLowerCase().replace(/[^a-z0-9 ]+/g,'').replace(/\s+/g,' ').trim(); }
  function sameish(a,b){ a=flat(a); b=flat(b); return !!a && !!b && (a.indexOf(b)>=0 || b.indexOf(a)>=0); }
  function andList(arr){
    if(arr.length===1)return arr[0];
    if(arr.length===2)return arr[0]+' and '+arr[1];
    return arr.slice(0,-1).join(', ')+' and '+arr[arr.length-1];
  }
  /* the honesty rule made mechanical: a line may be set in serif only if a
     source document is recorded against it. No src, no serif — the reader
     can tell source material from the file's own prose without being told. */
  function voice(n){ return n && n.src ? 'his' : 'filed'; }

  var reader=document.getElementById('reader'),
      readerBody=document.getElementById('readerBody'),
      readerClose=document.getElementById('readerClose'),
      readingId=null;

  function openReader(n){
    readingId=n.id;
    var home=byId[n.mig];
    var essay=(n.register==='long-form essay'||n.register==='reflective monologue');
    var notMine=(n.register==='quote — not mine');
    var paras=(n.line||'').split('… ');
    var sibs=owned[n.mig].filter(function(id){return byId[id].t!=='minor';});
    var idx=sibs.indexOf(n.id)+1;

    /* ── running head ── */
    var head='<div class="dochead">'+
      '<span class="dh-l">Siddhesh Thapa</span>'+
      '<span class="dh-c">'+esc(home.label)+'</span>'+
      '<span class="dh-r">File '+pad2(idx)+' / '+pad2(sibs.length)+'</span>'+
      '<i class="docprog"></i></div>';

    /* ── the title page ── */
    var lead = essay ? paras[0]+(paras.length>1?'…':'') : (n.line||n.label);
    // the label is only worth showing when it is not just the line in capitals
    var title = notMine ? '' : (essay || !sameish(n.label,n.line)) ? n.label : '';
    /* provenance, not a byline. `src` records which document a line was drawn
       from — which is not the same as claiming he wrote that sentence, and
       some of these lines are drawn from a source rather than quoted out of
       it. The page says what is recorded and nothing more. */
    var attr = notMine
      ? '<span class="warn">Not his words</span> · <b>'+esc(n.label)+'</b>'+
        (n.src?' · kept in '+esc(n.src):'')
      : (n.src?'From <b>'+esc(n.src)+'</b>'
             :'<span class="warn">No source recorded</span>');

    /* ── the sections, in the order a reader wants them ── */
    var secs=[];

    /* the ellipsis in a source line marks material left out, so it has to
       survive the paragraph split — without it the passage reads as if he
       wrote a sentence that stops dead and restarts in lower case */
    if(essay) secs.push(['The writing in full',
      '<div class="full">'+paras.map(function(p,i){
        return '<p>'+esc(p)+(i<paras.length-1?'…':'')+'</p>'; }).join('')+'</div>']);

    if(n.t==='contradiction'){
      var ends=adj[n.id].slice(0,2).map(function(k){
        var o=byId[k.o];
        return '<div class="pole"><span class="plabel">'+esc(o.label)+'</span>'+
               '<p class="'+voice(o)+'">'+esc(o.line||o.label)+'</p></div>';
      });
      if(ends.length===2) secs.push(['What it holds apart',
        '<div class="poles">'+ends.join('')+'</div>'+
        '<p class="polenote">Both stand. Neither has been given up.</p>']);
    }

    /* the explanation — every clause of it derived from the record */
    var p1=typeNote(n)+' '+(STATE_NOTE[n.state]||'');
    var p2=n.src?'Recorded in <b>'+esc(n.src)+'</b>.'
                :'<span class="warn">No source is recorded against this</span>, which in this file means it is not his writing.';
    if(n.register && !sameish(n.register,kindOf(n)))
      p2+=' The register kept against it is <b>'+esc(n.register)+'</b>. Read it as that.';
    var reach=(n.crosses||[]).filter(function(m){return byId[m];})
                .map(function(m){return '<b>'+esc(byId[m].label.toLowerCase())+'</b>';});
    var deg=adj[n.id].length;
    var p3='It belongs to <b>'+esc(home.label.toLowerCase())+'</b>'+
           (reach.length?', and reaches into '+andList(reach):'')+'. '+
           (deg?numw(deg)+' other '+(deg===1?'thing':'things')+' here connect'+(deg===1?'s':'')+
                ' to it, and the notes below say how.'
               :'Nothing else here connects to it yet.');

    var record='<dl class="record">'+
      '<dt>Kind</dt><dd>'+esc(kindOf(n))+'</dd>'+
      '<dt>State</dt><dd>'+esc(n.state)+'</dd>'+
      (n.register?'<dt>Register</dt><dd>'+esc(n.register)+'</dd>':'')+
      '<dt>Source</dt><dd>'+(n.src?esc(n.src):'none recorded')+'</dd>'+
      '<dt>Region</dt><dd>'+esc(home.label.toLowerCase())+'</dd>'+
      (reach.length?'<dt>Reaches</dt><dd>'+(n.crosses||[]).filter(function(m){return byId[m];})
        .map(function(m){return esc(byId[m].label.toLowerCase());}).join(' · ')+'</dd>':'')+
      '<dt>Connections</dt><dd>'+deg+'</dd>'+
    '</dl>';

    secs.push(['What this is',
      '<p class="note">'+p1+'</p><p class="note">'+p2+'</p><p class="note">'+p3+'</p>'+record]);

    /* the connections, always rendered in the edge's own direction */
    if(deg) secs.push(['Why it connects', adj[n.id].map(function(k,i){
      var e=k.e, other=byId[k.o];
      function end(id){
        return id===n.id ? '<span class="self">'+esc(byId[id].label)+'</span>' : esc(byId[id].label);
      }
      return '<button class="lnk" data-rgo="'+other.id+'">'+
        '<span class="n">'+pad2(i+1)+'</span><span>'+
        '<span class="rel">'+end(e[0])+' &nbsp;'+esc(e[2])+'&nbsp; '+end(e[1])+'</span>'+
        '<span class="to">'+esc(other.label.toLowerCase())+'</span>'+
        '<span class="why">'+esc(e[3])+'</span></span></button>';
    }).join('')]);

    var cross=crossings(n);
    if(cross.length) secs.push(['Where it leads', cross.map(function(c){
      return '<button class="xgo" data-rgo="'+c.mig+'">'+esc(byId[c.mig].label)+
             '<em>'+(c.via?'via '+esc(byId[c.via].label.toLowerCase()):'follow the connection')+' →</em>'+
             '</button>';
    }).join('')]);

    /* the title page, and the catchword at its foot — the old printer's
       trick of naming what is on the next page, which is the whole job
       here: promise the explanation, then deliver it below the fold */
    var plate='<section class="docplate'+(lead.length>150?' long':'')+'">'+
      '<p class="pkind">'+esc(kindOf(n))+'</p>'+
      (title?'<p class="ptitle">'+esc(title)+'</p>':'')+
      '<p class="pline">'+esc(lead)+'</p>'+
      '<div class="prule"></div>'+
      '<p class="pattr">'+attr+'</p>'+
      '<div class="pcue"><span>'+esc(secs[0][0])+' &nbsp;↓</span><i></i></div>'+
    '</section>';

    var body='<div class="docbody">'+secs.map(function(s,i){
      return '<section class="sec"><div class="num">'+pad2(i+1)+'</div>'+
             '<div><h2>'+esc(s[0])+'</h2>'+s[1]+'</div></section>';
    }).join('')+'</div>';

    var foot='<footer class="docfoot">'+
      '<span>Ref. '+esc(n.id)+'</span>'+
      '<span class="folio">— '+esc(home.label.toLowerCase())+' · file '+pad2(idx)+' —</span>'+
      '<span>siddheshthapa.com</span>'+
      '<p class="colophon">Serif is source material: every line of it traces back to the '+
      'document named beneath it. Sans is the file’s own voice — the headings, the notes, '+
      'the reason two things are set next to each other. Nothing on this page explains what '+
      'he meant by any of it. The file has no way of knowing.</p>'+
    '</footer>';

    readerBody.innerHTML='<article class="doc">'+head+plate+body+foot+'</article>';
    reader.classList.remove('scrolled');
    reader.style.setProperty('--prog','0%');
    reader.classList.add('on');
    reader.scrollTop=0;
  }
  function closeReader(){ reader.classList.remove('on'); readingId=null; }
  readerClose.addEventListener('click',closeReader);
  /* how far through the file you are, and when the title page is behind you */
  reader.addEventListener('scroll',function(){
    var span=reader.scrollHeight-reader.clientHeight;
    reader.style.setProperty('--prog',(span>0?(reader.scrollTop/span*100):0).toFixed(2)+'%');
    reader.classList.toggle('scrolled', reader.scrollTop>30);
  },{passive:true});
  reader.addEventListener('click',function(ev){
    var b=ev.target.closest('[data-rgo]'); if(!b)return;
    var t=byId[b.getAttribute('data-rgo')];
    if(isWriting(t)) openReader(t);
    else { closeReader(); open(t); }
  });

  /* ══════════════════════════════════════════════════════════════
     THE PARALLEL LAYER — the graph, as structure

     retarget() has already worked out what is on screen: ring1, ring2
     and rim. That is the visible set, so the nav mirrors exactly it —
     no second source of truth to drift.

     Order matters, because for a screen reader the order IS the
     composition: where you are, then what it connects to, then the
     ways out.
     ══════════════════════════════════════════════════════════════ */
  var graphNav=document.getElementById('graphnav'),
      annEl=document.getElementById('ann'),
      navIds=[], navAt=0;

  function describe(n){
    if(n.t==='mig'){
      var mn=minorsOf(n.id).length,
          wr=owned[n.id].filter(function(id){return byId[id].t!=='minor';}).length;
      return n.label.toLowerCase()+', region'+
        (mn||wr ? ', '+mn+' concept'+(mn===1?'':'s')+' and '+wr+' writing'+(wr===1?'':'s')
                : ', empty by design');
    }
    var d=adj[n.id].length;
    return n.label.toLowerCase()+', '+kindOf(n).toLowerCase()+
      (n.t==='minor'?'':', '+n.state)+
      ', in '+byId[n.mig].label.toLowerCase()+
      ', '+d+' connection'+(d===1?'':'s');
  }

  /* describe() names the node because the announcement has no other context.
     A sheet row already shows the label directly above, so repeating it there
     is noise for a reader and for a screen reader alike. */
  function shortMeta(n){
    if(n.t==='mig'){
      var mn=minorsOf(n.id).length,
          wr=owned[n.id].filter(function(id){return byId[id].t!=='minor';}).length;
      return (mn||wr)? mn+' concepts · '+wr+' writings' : 'empty by design';
    }
    var d=adj[n.id].length;
    return kindOf(n).toLowerCase()+(n.t==='minor'?'':' · '+n.state)+
           ' · '+d+' connection'+(d===1?'':'s');
  }

  function navSet(){
    var m=mode(), out=[];
    if(m==='world'){
      MIGS.forEach(function(M){ out.push([M.id,'Region']); });
      return out;
    }
    out.push([focus.id,'You are here']);
    // what this idea reaches, in the same order the ring draws it
    Object.keys(ring1).forEach(function(id){ out.push([id, m==='mig'?'Concept':'Connected']); });
    if(m==='mig'){
      owned[focus.id].filter(function(id){return byId[id].t!=='minor';})
        .forEach(function(id){ out.push([id,'Writing']); });
    }else{
      Object.keys(ring2).forEach(function(id){ out.push([id,'Two steps away']); });
    }
    Object.keys(rim).forEach(function(id){ out.push([id,'Leads to']); });
    return out;
  }

  /* The neuron vocabulary, drawn as a glyph instead of on the canvas. Same
     marks, same meanings — a phone must not flatten a contradiction and a
     project into two identical list rows. shape() stays the single canvas
     routine; this is the same alphabet in a different medium, and an
     acceptance check asserts the two cover exactly the same set of types. */
  function glyph(t,g){
    var S='<svg viewBox="0 0 22 22" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true">';
    switch(t){
      case 'mig':     return S+'<circle cx="11" cy="11" r="2.6" fill="currentColor" stroke="none"/><circle cx="11" cy="11" r="6" opacity=".5"/><circle cx="11" cy="11" r="9.2" opacity=".22"/></svg>';
      case 'minor':   return S+'<circle cx="11" cy="11" r="3.4" fill="currentColor" stroke="none"/>'+(g?'<circle cx="11" cy="11" r="7.4" opacity=".42"/>':'')+'</svg>';
      case 'thought': return S+'<circle cx="11" cy="11" r="4.4" fill="currentColor" stroke="none"/></svg>';
      case 'belief':  return S+'<circle cx="11" cy="11" r="4.6"/></svg>';
      case 'question':return S+'<path d="M11 5.4 16.6 11 11 16.6 5.4 11Z"/></svg>';
      case 'project': return S+'<rect x="6.4" y="6.4" width="9.2" height="9.2" fill="currentColor" stroke="none"/></svg>';
      case 'experiment': return S+'<circle cx="11" cy="11" r="4.2"/><path d="M11 3.4v3M11 15.6v3M3.4 11h3M15.6 11h3"/></svg>';
      case 'contradiction': return S+'<circle cx="8.4" cy="11" r="4.2"/><circle cx="13.6" cy="11" r="4.2"/></svg>';
      case 'person':  return S+'<circle cx="11" cy="11" r="2.2" fill="currentColor" stroke="none"/><circle cx="11" cy="11" r="6.4"/></svg>';
      case 'reference': return S+'<rect x="4.6" y="9.6" width="12.8" height="2.8" fill="currentColor" stroke="none"/></svg>';
    }
    return S+'</svg>';
  }
  var GLYPH_TYPES=['mig','minor','thought','belief','question','project','experiment','contradiction','person','reference'];

  function syncNav(){
    if(!entered){ graphNav.innerHTML=''; navIds=[]; return; }
    var set=navSet(), keep=navIds[navAt];
    navIds=set.map(function(s){return s[0];});
    graphNav.innerHTML=set.map(function(s,i){
      var n=byId[s[0]], here=s[1]==='You are here';
      // the relationship this row would follow, in the edge's own direction
      var link=(focus&&n!==focus)?adj[focus.id].filter(function(k){return k.o===n.id;})[0]:null;
      // always in the edge's own direction — the V0.2 inversion bug is not
      // allowed back in through a different renderer
      var verb=link
            ? esc(byId[link.e[0]].label.toLowerCase())+' <b>'+esc(link.e[2])+'</b> '+
              esc(byId[link.e[1]].label.toLowerCase())
            : '';
      return '<button type="button" data-nav="'+n.id+'"'+(here?' data-here="1"':'')+
             ' tabindex="'+(i?'-1':'0')+'">'+
             '<i class="nv-g">'+glyph(n.t,n.g)+'</i>'+
             '<span class="nv-l">'+esc(n.label.toLowerCase())+'</span> '+
             '<span class="nv-m">'+esc(s[1])+' · '+esc(shortMeta(n))+'</span> '+
             (verb?'<span class="nv-v">'+verb+'</span> ':'')+
             (link?'<span class="nv-w">'+esc(link.e[3])+'</span>':'')+
             '</button>';
    }).join('');
    var back=navIds.indexOf(keep);
    navAt=back>=0?back:0;
    setRoving();
  }
  function setRoving(){
    var bs=graphNav.children;
    for(var i=0;i<bs.length;i++) bs[i].tabIndex = i===navAt ? 0 : -1;
  }
  function navGo(i,move){
    if(!navIds.length)return;
    navAt=(i+navIds.length)%navIds.length;
    setRoving();
    if(move&&graphNav.children[navAt]) graphNav.children[navAt].focus();
  }
  function announce(s){ annEl.textContent=s; }

  /* what the canvas rings: whatever the keyboard is actually on */
  function navFocusId(){
    var a=document.activeElement;
    return a && a.dataset && a.dataset.nav ? a.dataset.nav : null;
  }

  graphNav.addEventListener('keydown',function(ev){
    var k=ev.key;
    if(k==='ArrowDown'||k==='ArrowRight'){ ev.preventDefault(); navGo(navAt+1,true); }
    else if(k==='ArrowUp'||k==='ArrowLeft'){ ev.preventDefault(); navGo(navAt-1,true); }
    else if(k==='Home'){ ev.preventDefault(); navGo(0,true); }
    else if(k==='End'){ ev.preventDefault(); navGo(navIds.length-1,true); }
  });
  graphNav.addEventListener('focusin',function(ev){
    var i=navIds.indexOf(ev.target.dataset.nav);
    if(i>=0){ navAt=i; setRoving(); }
  });
  graphNav.addEventListener('click',function(ev){
    var b=ev.target.closest('[data-nav]'); if(!b)return;
    var n=byId[b.dataset.nav];
    if(n===focus)return;
    if(isWriting(n)) openReader(n); else open(n);
  });

  function syncBack(){
    backBtn.classList.toggle('on', entered && history.length>0);
    // the way out only exists once you are inside somewhere
    mindBtn.classList.toggle('on', entered && !!focus);
  }

  /* `<` steps back one view. The brain leaves the climate altogether and
     returns to the neutral map — but still records where you were, so the
     chevron can walk you back in. They are different promises. */
  function goHome(){
    if(!focus)return;
    history.push(focus.id); if(history.length>40)history.shift();
    focus=null; hoverEdge=null; hover=null;
    emerge.classList.remove('on');
    syncWorld(); retarget(); syncBack(); syncNav();
    announce('The whole mind. '+MIGS.length+' regions.');
  }

  /* ── crossing a border changes the weather, not the machinery ── */
  var migTitle=document.getElementById('migTitle'), worldClass='';

  /* ── the environment profile is the single source of truth ──
     These seven colours used to be written twice: once as rgb triples in
     WORLDS for the canvas, and once as hex in a per-world CSS block for the
     page. Nothing checked that the two agreed, so a region could drift into
     being two different colours depending on which layer you looked at.
     The profile now declares them once and hands them to CSS. */
  var TOKEN=[['ground','--env'],['ink','--ink'],['ink2','--ink-2'],['ink3','--ink-3'],
             ['line','--line'],['accent','--accent'],['accentSoft','--accent-soft']];
  function applyProfile(m){
    var w=m?(WORLDS[m.id]||NEUTRAL):null, st=document.documentElement.style;
    TOKEN.forEach(function(t){
      if(w&&w[t[0]]) st.setProperty(t[1],'rgb('+w[t[0]].join(',')+')');
      else st.removeProperty(t[1]);      // the neutral map inherits :root
    });
    // the semantic half of the profile, exposed so CSS can compose on it
    ['material','contrast','temperature'].forEach(function(k){
      if(w&&w[k]) document.documentElement.setAttribute('data-'+k,w[k]);
      else document.documentElement.removeAttribute('data-'+k);
    });
  }

  function syncWorld(){
    var m=currentMig(), cls=m?('w-'+m.id):'';
    if(cls!==worldClass){
      if(worldClass)document.documentElement.classList.remove(worldClass);
      if(cls)document.documentElement.classList.add(cls);
      worldClass=cls;
      applyProfile(m);
    }
    if(m&&entered){
      if(migTitle.dataset.mig!==m.id){
        migTitle.dataset.mig=m.id;
        migTitle.innerHTML='<small>'+(focus&&focus.t==='mig'?'the region of':'inside')+'</small>'+esc(m.label);
      }
      migTitle.classList.add('on');
    }else{
      migTitle.classList.remove('on');
      migTitle.dataset.mig='';
    }
  }

  function open(n){
    if(focus!==n){ history.push(focus?focus.id:null); if(history.length>40)history.shift(); }
    focus=n; render(n); syncWorld(); retarget();
    whisper.classList.remove('on'); syncBack(); syncNav();
    announce(describe(n)+'.');
  }
  function goBack(){
    if(!history.length)return;
    var prev=history.pop();
    focus=prev?byId[prev]:null;
    if(focus){ render(focus); } else { emerge.classList.remove('on'); }
    hoverEdge=null; syncWorld(); retarget(); syncBack(); syncNav();
    announce(focus?describe(focus)+'.':'The whole mind.');
  }
  backBtn.addEventListener('click',goBack);
  mindBtn.addEventListener('click',goHome);

  function wander(){
    if(!focus)return;
    var cur=focus,path=[],hops=2+Math.floor(Math.random()*2),visited={};
    visited[cur.id]=1;
    for(var i=0;i<hops;i++){
      var opts=[];
      adj[cur.id].forEach(function(k){ if(!visited[k.o])opts.push(byId[k.o]); });
      if(cur.t==='mig') minorsOf(cur.id).forEach(function(id){ if(!visited[id])opts.push(byId[id]); });
      else { if(!visited[cur.mig])opts.push(byId[cur.mig]);
             (cur.crosses||[]).forEach(function(mid){ if(!visited[mid])opts.push(byId[mid]); }); }
      if(!opts.length)break;
      var curMig=cur.t==='mig'?cur.id:cur.mig;
      var crossing=opts.filter(function(o){ return (o.t==='mig'?o.id:o.mig)!==curMig; });
      var pool=(crossing.length&&Math.random()<.62)?crossing:opts;
      cur=pool[Math.floor(Math.random()*pool.length)];
      visited[cur.id]=1;path.push(cur);
    }
    if(!path.length)return;
    path.forEach(function(n){ open(n); });      // every hop is a real step back
  }

  cv.addEventListener('mousemove',function(ev){
    if(!entered)return;
    var r=cv.getBoundingClientRect(),mx=ev.clientX-r.left,my=ev.clientY-r.top;
    var n=nodeAt(mx,my); hover=n;
    var e=n?null:edgeAt(mx,my); hoverEdge=e;
    cv.style.cursor=(n||e||fragmentAt(mx,my))?'pointer':'default';
    if(focus&&mode()!=='mig'){
      if(n&&n!==focus){
        var link=adj[focus.id].filter(function(k){return k.o===n.id;})[0];
        if(link){hoverEdge=link.e;showWhy(link.e);} else clearWhy();
      }else if(e){showWhy(e);} else clearWhy();
    }
  });
  cv.addEventListener('mouseleave',function(){hover=null;hoverEdge=null;clearWhy();});

  cv.addEventListener('click',function(ev){
    if(!entered)return;
    var r=cv.getBoundingClientRect(),mx=ev.clientX-r.left,my=ev.clientY-r.top;
    var n=nodeAt(mx,my);
    if(n){ if(isWriting(n)) openReader(n); else open(n); return; }
    var e=edgeAt(mx,my);
    if(e){ var t=byId[e[0]===focus.id?e[1]:e[0]]; if(isWriting(t)) openReader(t); else open(t); return; }
    /* A fragment is a doorway into the writing it was cropped from. Checked
       after nodes and edges, because it is the background layer — the graph
       always wins a contested pixel. */
    var fg=fragmentAt(mx,my);
    if(fg){ openReader(fg); return; }
    goBack();
  });

  /* Touch. The sheet is the primary interface on a phone, but the
     constellation above it must still be tappable — with a fingertip-sized
     target, not the 18px one designed for a mouse. */
  cv.addEventListener('touchstart',function(ev){
    if(!entered||ev.touches.length!==1)return;
    var r=cv.getBoundingClientRect(),t=ev.touches[0];
    var tx=t.clientX-r.left, ty=t.clientY-r.top;
    // a node first, then the fragment behind it — same precedence as the mouse
    var n=nodeAt(tx,ty,true) || fragmentAt(tx,ty);
    if(!n)return;
    ev.preventDefault();                       // do not also fire a synthetic click
    if(isWriting(n)) openReader(n); else if(n!==focus) open(n);
  },{passive:false});

  emerge.addEventListener('click',function(ev){
    var b=ev.target.closest('button');if(!b)return;
    if(b.dataset.read){ openReader(byId[b.dataset.read]); return; }
    if(b.dataset.go){ var t=byId[b.dataset.go]; if(isWriting(t)) openReader(t); else open(t); return; }
    if(b.dataset.wander)wander();
  });

  document.addEventListener('keydown',function(ev){
    if(ev.key!=='Escape')return;
    if(reader.classList.contains('on')){ closeReader(); return; }   // leave the page first
    if(history.length)goBack();
    else if(entered){entered=false;threshold.classList.remove('gone');syncBack();syncWorld();ambient();}
  });

  /* ── threshold ── */
  var FRAGMENTS=[
    'Why do people worship wealth?',
    'What if curiosity matters more than utility?',
    'Potential is cheap.',
    'A song stores who you were while it was playing.',
    'What does value actually mean?',
    'First comes desire, then justification.',
    'Disciplinary boundaries are tools, not walls.',
    'Is being understood the same as being loved?'
  ];
  var fragT=null,pulseT=null;
  function ambient(){
    clearTimeout(fragT);clearTimeout(pulseT);
    if(entered){fragEl.classList.remove('on');return;}
    fragT=setTimeout(function schedule(){
      if(entered)return;
      fragEl.textContent=FRAGMENTS[Math.floor(Math.random()*FRAGMENTS.length)];
      fragEl.style.left=(52+Math.random()*24)+'%';
      fragEl.style.top=(20+Math.random()*56)+'%';
      fragEl.classList.add('on');
      setTimeout(function(){fragEl.classList.remove('on');},3600);
      fragT=setTimeout(schedule,6200+Math.random()*4200);
    },2600);
    pulseT=setTimeout(function pulse(){
      if(entered)return;
      pulseEdge=EDGES[Math.floor(Math.random()*EDGES.length)];
      pulseStart=performance.now();
      pulseT=setTimeout(pulse,4200+Math.random()*3800);
    },3400);
  }

  enterBtn.addEventListener('click',function(){
    entered=true;threshold.classList.add('gone');ambient();syncBack();syncWorld();syncNav();
    announce('Inside the mind. '+MIGS.length+' regions. Use the map to move between ideas.');
    setTimeout(function(){ if(!focus)whisper.classList.add('on'); },1200);
    setTimeout(function(){ whisper.classList.remove('on'); },9000);
  });

  resize();ambient();requestAnimationFrame(draw);
})();
</script>
